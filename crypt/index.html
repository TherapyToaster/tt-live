// MR. TOASTY'S CRYPT: a room-by-room twin-stick roguelike (Isaac-style floors, UnderMine-style town + meta)
// Plain JS + canvas 2D + WebAudio. Everything (art, music, sfx) is generated in code; no asset files.
// Game logic runs in a small logical space (LW x 180); v0.2 renders it into an HD (2x) pixel buffer so sprites/tiles get
// twice the detail, then scales that up nearest-neighbour onto the screen canvas. Holder cosmetics / wallet code: none (see design doc, "Later").
// =====================================================================================================
const VERSION='0.2.1';
const LH=180,TILE=16,RW=15,RH=9,RPW=RW*TILE,RPH=RH*TILE; // room = 15x9 tiles incl. walls (13x7 floor)

const buf=document.createElement('canvas'),bx=buf.getContext('2d');

const QS=new URLSearchParams(location.search);
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);CW=innerWidth;CH=innerHeight;cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);
 const a=CW/Math.max(1,CH);LW=Math.max(320,Math.min(400,Math.round(LH*a)));buf.width=LW*HD;buf.height=LH*HD;fxb.width=LW*HD;fxb.height=LH*HD;bx.imageSmoothingEnabled=false;
 SC=Math.min(cv.width/LW,cv.height/LH);OX=(cv.width-LW*SC)/2;OY=(cv.height-LH*SC)/2;ROOMX=((LW-RPW)/2)|0;ROOMY=LH-RPH-4;
 for(const f of RESIZE_HOOKS)f()}

function RNG(seed){let a=(seed>>>0)||1;const r=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
 r.int=(n)=>(r()*n)|0;r.pick=(arr)=>arr[(r()*arr.length)|0];r.range=(a,b)=>a+r()*(b-a);r.chance=(p)=>r()<p;

// 4-tone ramp with hue-shifted shadows (toward violet) and warm highlights: [shadow, mid-shadow, base, highlight]
const RAMPC={};function ramp(c){return RAMPC[c]||(RAMPC[c]=[mix(c,'#1a0b2e',.6),mix(c,'#2a1240',.3),c,mix(c,'#fff6d8',.45)])}

// pixel buffer painter (native HD pixels)

  for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){const nx=(x+.5-cx)/rx,ny=(y+.5-cy)/ry,d=nx*nx+ny*ny;if(d>1)continue;
   if(o.clip&&!o.clip(x,y))continue;if(o.flat){this.set(x,y,V[o.tone??2]);continue}
   const nz=Math.sqrt(1-d);const L=lx*nx+ly*ny+.6*nz+BAYER[(y&3)*4+(x&3)]*.18+(o.bias||0);this.set(x,y,V[L>.8?3:L>.36?2:L>.02?1:0])}}

  for(let j=0;j<h;j++)for(let i=0;i<w;i++){if(r){const qx=i<r?r-i-.5:i>=w-r?i-(w-r)+.5:0,qy=j<r?r-j-.5:j>=h-r?j-(h-r)+.5:0;if(qx*qx+qy*qy>r*r)continue}
   if(o.flat){this.set(x+i,y+j,V[o.tone??2]);continue}
   const ty=j/Math.max(1,h-1),tx=i/Math.max(1,w-1);let L=.62-ty*.95-(tx-.5)*.4+BAYER[((y+j)&3)*4+((x+i)&3)]*.22+(o.bias||0);if(j==0&&!o.notop)L=1;

  const s=(px,py,qx,qy,rx,ry)=>(px-rx)*(qy-ry)-(qx-rx)*(py-ry);for(let y=miny;y<=maxy;y++)for(let x=minx;x<=maxx;x++){const X=x+.5,Y=y+.5,d1=s(X,Y,ax,ay,bx,by),d2=s(X,Y,bx,by,cx,cy),d3=s(X,Y,cx,cy,ax,ay);
   if(!((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0)))this.set(x,y,v)}}
 text(s,x,y,c){s=String(s).toUpperCase();for(const ch of s){const m=F5[ch];if(m)for(let i=0;i<25;i++)if(m[i]=='1')this.set(x+i%5,y+((i/5)|0),c);x+=6}}

// canvas-drawn sprite at HD (vector ops), alpha-thresholded, optionally inked; fn gets a native-px context
function hsprite(name,w,h,fn,o={}){const c=mkc(w*HD,h*HD),g=c.getContext('2d');fn(g,c.width,c.height);const id=g.getImageData(0,0,c.width,c.height);const P=new PB(c.width,c.height);

// automatic form shading for flat-coloured art: lit upper-left edges, shaded lower-right edges (per colour region)

function hdify(name,rows,pal=PAL){const h=rows.length,w=Math.max(...rows.map(r=>r.length));const at=(x,y)=>x<0||y<0||y>=h||x>=w?'.':(rows[y][x]||'.');

  if(C==A&&C!=D&&A!=B)a=A;if(A==B&&A!=C&&B!=D)b=B;if(D==C&&D!=B&&C!=A)c=C;if(B==D&&B!=A&&D!=C)d=D;

const HERO_POSES=['i0','i1','w0','w1','w2','w3','a'];
function heroFrame(id,dir,pose){const L=HERO_LOOK[id],P=new PB(32,36);
 const bob=pose=='i1'||pose=='a'?1:pose=='w1'||pose=='w3'?-1:0,atk=pose=='a';

 if(!up&&!side){if(L.chest=='chain'){P.line(12,by+2,16,by+6,'#ffd400');P.line(20,by+2,16,by+6,'#ffd400');P.rect(15,by+6,2,2,'#fff2a8');P.set(16,by+7,'#c8862a')}

 // arms (attack pose raises the front arm)

 else{const ay=atk?-2:0;P.ell(8,by+4+ay,2.4,3.4,L.body);P.ell(24,by+4+ay,2.4,3.4,L.body)}

  else if(side){P.rect(16,cy+1,13,2,mix(L.hatC,'#000',.45));P.rect(16,cy+1,12,1,mix(L.hatC,'#3a4f9a',.5));P.rect(17,cy-4,3,3,'#ffd400')}
  else{P.rect(13,cy+1,6,2,INK);P.rect(13,cy+1,6,1,'#ffd400')}}
 else if(L.hat=='pat'){const py=hy-10;P.box(10,py,12,6,L.hatC,1);P.rect(11,py+1,4,1,'#fffbe8');for(const[x,l]of side?[[12,3],[19,4]]:[[11,3],[15,5],[20,2]])P.rect(x,py+5,1,l,L.hatC)}

// draw a shaded skull (native px) into a PB
function pbSkull(P,x,y,col,s=1){P.ell(x+5*s,y+4*s,5*s,4.4*s,col);P.box(x+2*s,y+6*s,6*s,3*s,col,1);P.ell(x+3*s,y+4.5*s,1.3*s,1.5*s,[INK,INK,INK,INK],{flat:1});P.ell(x+7*s,y+4.5*s,1.3*s,1.5*s,[INK,INK,INK,INK],{flat:1});

function bakeRoom(room,theme){const T=THEMES[theme],W=RPW*HD,H=RPH*HD,P=new PB(W,H),R=RNG(room.seed||1),N=32;

 // ---- floor: flagstones (1/2/4 slabs per tile), bevels, speckles, cracks, bones, moss / glitch pixels
 const slab=(x,y,w,h,c)=>{const V=ramp(c).map(u32);for(let j=0;j<h;j++)for(let i=0;i<w;i++){let t=2;if(j==0||i==0)t=3;else if(j==h-1||i==w-1)t=1;
   P.d[(y+j)*W+x+i]=V[t]}};

 for(let y=N;y<H-N;y+=16){let x=N-R.int(24);while(x<W-N){const w=20+R.int(26),x0=Math.max(N,x),x1=Math.min(W-N,x+w);if(x1-x0>2){const c=T.floor[R.int(3)];slab(x0+1,y+1,x1-x0-1,15,R.chance(.15)?mix(c,'#000000',.18):R.chance(.12)?mix(c,'#ffffff',.06):c);
   if(R.chance(.08)){const cx=x0+3+R.int(Math.max(1,x1-x0-8)),cy=y+3+R.int(8);P.rect(cx,cy,4+R.int(4),3+R.int(3),mix(c,'#000000',.45))}}x+=w}}
 for(let i=0;i<900;i++){const x=N+R.int(W-2*N),y=N+R.int(H-2*N),v=P.d[y*W+x];if(v!==mor)P.set(x,y,mix(T.floor[R.int(3)],R.chance(.5)?'#000000':'#ffffff',.18))}
 const deco=(n,fn)=>{for(let i=0;i<n;i++)fn(N+2+R.int(W-2*N-12),N+2+R.int(H-2*N-12))};
 deco(10+R.int(8),(x,y)=>{let cx=x,cy=y;const L=6+R.int(10);for(let i=0;i<L;i++){P.set(cx,cy,T.mortar);P.set(cx+1,cy,mix(T.floor[0],'#ffffff',.08));cx+=R.int(3)-1;cy+=R.chance(.6)?1:0}}); // cracks
 deco(2+R.int(3),(x,y)=>{if(R.chance(.65)){P.rect(x+2,y+1,6,2,'#cfc6b0');P.rect(x,y,2,2,'#e4dcc8');P.rect(x,y+2,2,2,'#e4dcc8');P.rect(x+8,y,2,2,'#e4dcc8');P.rect(x+8,y+2,2,2,'#e4dcc8');P.rect(x+2,y+3,6,1,'#8f8670')}

 for(let i=0;i<8+R.int(6);i++){const side=R.int(4);const x=side==0?N+2+R.int(8):side==1?W-N-10+R.int(8):N+R.int(W-2*N),y=side==2?N+2+R.int(6):side==3?H-N-8+R.int(6):N+R.int(H-2*N);mossAt(x,y,18+R.int(20))}
 if(T.glitch)deco(26,(x,y)=>{const c=T.glitch[R.int(2)],l=1+R.int(7);for(let i=0;i<l;i++)P.set(x+i,y,R.chance(.7)?c:'#ffffff')}); // dead pixels
 if(T.glitch)for(let i=0;i<5;i++){let x=N+R.int(W-2*N),y=N+R.int(H-2*N);const c=mix('#3a1f66',T.glitch[i&1],.25);for(let k=0;k<30;k++){P.set(x,y,c);if(R.chance(.2))R.chance(.5)?x++:y++;else if(k%2)x++;else y++}} // circuits
 if(theme==1)deco(6,(x,y)=>{P.set(x,y,'#ffd400');P.set(x+1,y,'#c8862a')}); // stray gold flecks
 // ambient occlusion along the walls
 for(let y=N;y<H-N;y++)for(let x=N;x<W-N;x++){const d=Math.min(y-N,x-N,W-N-1-x,H-N-1-y)+(y-N<12?-(y-N<12?3:0):0);if(d>10)continue;const i=y*W+x,v=P.d[i];
  const k=d<2?.55:d<5?.38:d<8?.2:.1,th=BAYER[(y&3)*4+(x&3)]+.5;if(d>=8&&th>.5)continue;const r=v&255,g=v>>8&255,b=v>>16&255;P.d[i]=((255<<24)|((b*(1-k))<<16)|((g*(1-k))<<8)|(r*(1-k)))>>>0}
 // ---- walls: north = lit brick face with a top cap; sides/bottom = darker wall tops with an inner lip
 const brickRow=(x0,x1,y,h,off,c1,c2,hi,dim)=>{for(let x=x0-off;x<x1;x+=16){const a=Math.max(x0,x),b=Math.min(x1,x+15);if(b<=a)continue;const c=mix(R.chance(.5)?c1:c2,'#000000',dim);
  P.rect(a,y,b-a,h-1,c);P.rect(a,y,b-a,1,mix(c,hi,.55));P.rect(a,y+h-2,b-a,1,mix(c,'#000000',.35));if(R.chance(.25))P.set(a+2+R.int(Math.max(1,b-a-4)),y+2+R.int(Math.max(1,h-4)),mix(c,'#000000',.4))}};
 P.rect(0,0,W,N,T.mortar);P.rect(0,H-N,W,N,T.mortar);P.rect(0,0,N,H,T.mortar);P.rect(W-N,0,N,H,T.mortar);

 for(let y=N;y<H-N+8;y+=8){brickRow(0,N-4,y,8,((y/8)%2)*8,T.brick,T.brick2,T.brickHi,.35);brickRow(W-N+4,W,y,8,((y/8)%2)*8,T.brick,T.brick2,T.brickHi,.35)}
 for(let r=0;r<3;r++)brickRow(N-4,W-N+4,H-N+4+r*8,8,(r%2)*8,T.brick,T.brick2,T.brickHi,.45);
 P.rect(N-4,N,3,H-2*N,mix(T.brickHi,'#000',.25));P.rect(W-N+1,N,3,H-2*N,mix(T.brick,'#000',.15));P.rect(N-4,H-N,W-2*N+8,4,mix(T.brickHi,'#000',.2));P.rect(N-4,H-N,W-2*N+8,1,mix(T.brickHi,'#fff',.1));
 // corner pillars
 for(const[x,y]of[[0,0],[W-N,0],[0,H-N],[W-N,H-N]]){P.box(x+2,y+2,N-4,N-4,T.brick,3);P.rect(x+4,y+4,N-8,3,T.accent);P.rect(x+4,y+5,N-8,1,mix(T.accent,'#000',.4));pbSkull(P,x+11,y+13,T.skull)}
 // north-wall niches: skulls + candles (light sources); side-wall sconces
 const doorX=RPW/2*HD;for(const lx of[40,88,152,200]){const x=lx*HD-8;if(Math.abs(x+8-doorX)<44)continue;P.rect(x,9,16,19,'#050304');P.ell(x+8,10,8,5,[ '#050304','#050304','#050304','#050304'],{flat:1});
  P.rect(x-1,27,18,2,mix(T.brickHi,'#000',.1));pbSkull(P,x+3,15,T.skull);room.candles.push({x:lx+3,y:7,big:0});room.lights.push({x:lx+3,y:10,r:30,col:T.candle})}
 for(const lx of[56,184])if(Math.abs(lx*HD-doorX)>44)pbSkull(P,lx*HD-5,11,mix(T.skull,'#000',.25));
 for(const ly of[36,108]){for(const sx of[1,RW-1]){const x=sx==1?N-12:W-N+4;P.box(x,ly*HD-4,8,10,'#5c6570',1);room.candles.push({x:(x+4)/HD,y:ly-4,big:1});room.lights.push({x:(x+4)/HD,y:ly-2,r:34,col:T.candle})}}
 // ---- obstacles
 if(room.grid)for(let y=0;y<7;y++)for(let x=0;x<13;x++){const v=room.grid[y*13+x];if(v)drawPropHD(P,room,v,(x+1)*TILE,(y+1)*TILE,theme,R)}
 const c=P.canvas(),g=c.getContext('2d');g.imageSmoothingEnabled=false;g.scale(HD,HD);
 if(room.kind=='start'&&theme!='hub'){const hint=IS_TOUCH?['LEFT STICK MOVE','RIGHT STICK AIM + FIRE']:['WASD MOVE','ARROWS / MOUSE SHOOT'];g.globalAlpha=.55;
  text5s(g,hint[0],(RPW-text5w(hint[0]))/2,RPH/2-14,T.accent);text5s(g,hint[1],(RPW-text5w(hint[1]))/2,RPH/2+18,T.accent);g.globalAlpha=1}

 if(room.kind=='secret'){g.globalAlpha=.7;text5s(g,'EVERYONE HAS SECRETS',(RPW-text5w('EVERYONE HAS SECRETS'))/2,22,'#ff2bd6');g.globalAlpha=1}
 return c}

function drawPropHD(P,room,v,lx,ly,theme,R){const T=THEMES[theme],x=lx*HD,y=ly*HD,h=hash(room.seed+':'+lx+','+ly)%100;
 const shadowE=(w)=>{for(let j=0;j<5;j++)for(let i=-w;i<=w;i++){if(i*i/(w*w)+(j-2)*(j-2)/6>1)continue;const k=x+16+i,l=y+27+j,q=P.get(k,l);const r=q&255,g=q>>8&255,b=q>>16&255;P.d[l*P.w+k]=((255<<24)|((b*.45)<<16)|((g*.45)<<8)|(r*.45))>>>0}};

  P.rect(x+5,y+29,22,1,mix(T.accent,'#000',.3))}
 else if(v==1){shadowE(14);for(const[ux,s]of[[9,1],[22,.8]]){const cx=x+ux,c=T.urn;P.ell(cx,y+19,8*s,9*s,c);P.box(cx-4*s,y+8,8*s,4,mix(c,'#000',.2),1);P.rect(cx-5*s,y+7,10*s,2,mix(c,'#fff',.25));
   P.rect(cx-7*s,y+18,14*s,2,T.accent);P.ell(cx-8*s,y+15,1.6,3,mix(c,'#000',.25));P.ell(cx+8*s,y+15,1.6,3,mix(c,'#000',.25));if(theme==2)P.set(cx-2,y+22,'#00f0ff')}}
 else if(v==2&&(h<(theme==2?40:66)||theme=='hub')){shadowE(13);const st=theme==2?'#5a5a7a':'#6a7078';P.box(x+5,y+3,22,25,st,7);P.box(x+3,y+25,26,5,mix(st,'#000',.25),1);
  P.rect(x+15,y+8,2,12,mix(st,'#000',.45));P.rect(x+11,y+11,10,2,mix(st,'#000',.45));P.line(x+21,y+6,x+24,y+14,mix(st,'#000',.5));P.line(x+24,y+14,x+22,y+19,mix(st,'#000',.5));
  for(let i=0;i<10;i++)P.set(x+4+R.int(24),y+26+R.int(4),T.moss[R.int(3)]);P.rect(x+3,y+29,26,1,mix(T.accent,'#000',.35))}
 else if(v==2){shadowE(14);const cab=theme==2?'#3a3050':'#5a4630';P.box(x+2,y+6,28,22,cab,3);P.rect(x+5,y+9,19,14,'#0b0a0f');P.rect(x+26,y+11,2,2,'#c9ccd6');P.rect(x+26,y+16,2,2,'#c9ccd6');
  P.line(x+12,y+6,x+7,y,'#a9b3bd');P.line(x+18,y+6,x+24,y+1,'#a9b3bd');P.box(x+6,y+27,20,3,mix(cab,'#000',.3),1);P.line(x+22,y+9,x+18,y+16,'#2a2a2a');
  room.tvs.push({x:lx+3,y:ly+5,w:8.5,h:6.5});room.lights.push({x:lx+8,y:ly+8,r:22,col:'#9fe8ff',tv:1})}
 else if(v==3){for(let j=0;j<6;j++)for(let i=-18;i<=18;i++){if(i*i/324+(j-3)*(j-3)/9>1)continue;const k=x+16+i,l=y+27+j;P.set(k,l,'#050806')}
  P.box(x+1,y+16,30,14,'#5c6570',2);P.rect(x+3,y+18,26,1,'#ffd400');P.text('TOASTY',x+16-17,y+22,'#ffd400');

 AU.master=ac.createGain();AU.master.connect(comp);AU.mus=ac.createGain();AU.mus.connect(AU.master);AU.sfx=ac.createGain();AU.sfx.connect(AU.master);
 AU.crush=ac.createWaveShaper();AU.crush.connect(AU.mus);setCrush(0);
 const n=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noiseBuf=n;auVol()}catch(e){AU.ac=null}return AU.ac}
function setCrush(bits){const n=1024,c=new Float32Array(n);const q=bits?Math.pow(2,bits):0;for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=q?Math.round(x*q)/q:Math.tanh(x*1.5)}if(AU.crush)AU.crush.curve=c}

 env(g,t,.004,vol,dur);o.connect(g).connect(dest);o.start(t);o.stop(t+dur+.05);return o}

const SCALES={minor:[0,2,3,5,7,8,10],phrygian:[0,1,3,5,7,8,10],dorian:[0,2,3,5,7,9,10],harmonic:[0,2,3,5,7,8,11],penta:[0,3,5,7,10],locrian:[0,1,3,5,6,8,10]};
const GROOVES={four:['x...x...x...x...','....x.......x...','..x...x...x...x.'],breaks:['x.....x...x.....','....x.......x..x','x.x.x.x.x.x.x.x.'],
 half:['x.........x.....','........x.......','x.x.x.x.x.x.x.xx'],glitchhop:['x.x...x..x......','....x..x.x..x...','xx.x.xx.x.xx.x.x'],lofi:['x......x..x.....','....x.......x...','x.x.x.x.x.x.x.x.'],
 industrial:['x..x..x...x..x..','....x.......x...','xxxxxxxxxxxxxxxx']};
const PROGS=[[0,5,3,4],[0,3,4,3],[0,6,5,4],[0,2,5,4],[0,4,5,3]];
function makeSong(seed,style){const R=RNG(seed);const sc=style=='hub'?R.pick(['dorian','penta','minor']):style=='boss'?R.pick(['phrygian','harmonic','locrian']):R.pick(['minor','phrygian','dorian','harmonic','penta']);
 const bpm=style=='hub'?78+R.int(12):style=='boss'?150+R.int(20):style=='title'?96+R.int(10):108+R.int(40);
 const groove=style=='hub'?'lofi':style=='boss'?R.pick(['industrial','breaks','four']):style=='title'?'half':R.pick(['four','breaks','half','glitchhop','industrial']);
 const motif=[];for(let i=0;i<16;i++)motif.push(R()<.5?R.int(7):-1);const bass=[];for(let i=0;i<16;i++)bass.push(i%4==0?1:R()<.3?1:0);
 return{seed,style,scale:sc,root:36+R.int(12),bpm,groove,prog:R.pick(PROGS),motif,bass,arpW:R.pick(['square','sawtooth','triangle']),leadW:R.pick(['square','sawtooth']),
  arpRate:R()<.5?1:2,crush:style=='hub'?0:R.pick([0,4,5,6]),stutter:style=='hub'?0:.05+R()*.1,R}}
function songFor(key){ // key: 'title','hub','f1','f2','boss1','boss2'; floor songs re-roll so floors in a run never share key/tempo
 const rs=(GS.run&&GS.run.seed)||1;if(key=='title')return makeSong(1776,'title');if(key=='hub')return makeSong(2323,'hub');
 if(key.startsWith('boss'))return makeSong(rs*7+key.length*999+(+key.slice(4)),'boss');
 const f=+key.slice(1);let s=makeSong(hash(rs+':f'+f),'floor');if(f>1){const p=makeSong(hash(rs+':f'+(f-1)),'floor');let k=0;while((s.root%12==p.root%12||Math.abs(s.bpm-p.bpm)<10||s.groove==p.groove)&&k<30){s=makeSong(hash(rs+':f'+f+':'+k),'floor');k++}}return s}
function playSong(key){AU.want=key;if(!auInit()||AU.ac.state!='running'){return}if(AU.song&&AU.song.key==key)return;const s=songFor(key);s.key=key;AU.song=s;AU.step=0;AU.next=AU.ac.currentTime+.08;setCrush(s.crush);
 AU.log.push({key,bpm:s.bpm,root:s.root,scale:s.scale,groove:s.groove});if(!AU.timer)AU.timer=setInterval(schedule,25)}
function stopSong(){AU.song=null;AU.want=null}
function note(s,deg,oct=0){const sc=SCALES[s.scale];const o=Math.floor(deg/sc.length);const d=((deg%sc.length)+sc.length)%sc.length;return 440*Math.pow(2,(s.root+sc[d]+12*(o+oct)-69)/12)}
function schedule(){const s=AU.song,ac=AU.ac;if(!s||!ac)return;if(GS.paused||document.hidden){AU.next=ac.currentTime+.05;return}
 const spb=60/s.bpm/4;while(AU.next<ac.currentTime+.12){playStep(s,AU.step,AU.next,spb);AU.step++;AU.next+=spb;if(s.R()<s.stutter/16){AU.next+=spb/2}}}
function playStep(s,i,t,spb){const st=i%16,bar=(i/16|0),chord=s.prog[bar%4],G=GROOVES[s.groove],M=AU.mus,L=AU.crush;const boss=s.style=='boss',hub=s.style=='hub';
 if(G[0][st]=='x'){osc('sine',hub?110:150,t,hub?.25:.3,hub?.35:.55,M,40)}
 if(G[1][st]=='x'){nz(t,hub?.12:.16,hub?.12:.22,M,'bandpass',hub?1800:2400,.8);if(!hub)osc('triangle',220,t,.08,.08,M,120)}
 if(G[2][st]=='x')nz(t,.03,hub?.04:.06,M,'highpass',7000);
 if(s.bass[st])osc(boss?'sawtooth':'triangle',note(s,chord,-1),t,spb*(boss?1.6:2.4),boss?.16:.18,L,null,0);
 if(!hub||st%2==0){const arpOn=s.arpRate==2||st%2==0;if(arpOn&&bar>=1){const seq=[0,2,4,7];const deg=chord+seq[(st/(s.arpRate==2?1:2)|0)%4];osc(s.arpW,note(s,deg,1),t,spb*.9,hub?.035:.04,L)}}
 if(bar%4>=2&&s.motif[st]>=0&&!hub){osc(s.leadW,note(s,chord+s.motif[st],2),t,spb*1.8,.035,L,null,7)}
 if(hub&&st==0)osc('triangle',note(s,chord,1),t,spb*14,.05,M); // lofi pad
 if(hub&&st%4==2)nz(t,.02,.015,M,'highpass',3000); // vinyl crackle
 if(!hub&&s.R()<.025)for(let k=0;k<3;k++)osc('square',300+s.R()*3000,t+k*spb/3,spb/4,.025,L); // glitch blips
}

const GW=9,GH=8,DIRS={n:[0,-1],s:[0,1],w:[-1,0],e:[1,0]},OPP={n:'s',s:'n',w:'e',e:'w'};
const DOOR_TILE={n:[6,0],s:[6,6],w:[0,3],e:[12,3]}; // interior (13x7) tile right inside each door
const TEMPLATES=[
 null,
 [".............","..x.......x..",".............",".............",".............","..x.......x..","............."],
 [".............",".............",".....xxx.....",".....xxx.....",".....xxx.....",".............","............."],
 ["xx.........xx","x...........x",".............",".............",".............","x...........x","xx.........xx"],

 [".............","...xx...xx...","...x.....x...",".............","...x.....x...","...xx...xx...","............."],
 [".............","..x..x.x..x..",".............","..x.......x..",".............","..x..x.x..x..","............."],
 ["....x...x....","....x...x....",".............",".............",".............","....x...x....","....x...x...."],

];
function genFloor(seed,floor,pool,used){const R=RNG(hash(seed+':floor:'+floor));const N=floor==1?8+R.int(3):10+R.int(3);let tries=0;
 while(true){tries++;const g=new Map(),key=(x,y)=>x+','+y;const sx=4,sy=4;g.set(key(sx,sy),{gx:sx,gy:sy,d:0});const q=[[sx,sy]];const ends=[];
  while(q.length&&g.size<N){const[cx,cy]=q.shift();let added=0;for(const d of R.shuffle(['n','s','w','e'])){const[dx,dy]=DIRS[d],nx=cx+dx,ny=cy+dy;
    if(nx<0||ny<0||nx>=GW||ny>=GH||g.has(key(nx,ny))||g.size>=N)continue;let nb=0;for(const[ax,ay]of Object.values(DIRS))if(g.has(key(nx+ax,ny+ay)))nb++;
    if(nb>1||R()<.5)continue;g.set(key(nx,ny),{gx:nx,gy:ny,d:g.get(key(cx,cy)).d+1});q.push([nx,ny]);added++}
   if(!added&&(cx!=sx||cy!=sy))ends.push(key(cx,cy))}
  if(g.size<N&&tries<400)continue;
  // dead ends = exactly one neighbour
  const nbs=k=>{const r=g.get(k);let n=0;for(const[ax,ay]of Object.values(DIRS))if(g.has(key(r.gx+ax,r.gy+ay)))n++;return n};
  const dead=[...g.keys()].filter(k=>k!=key(sx,sy)&&nbs(k)==1);if(dead.length<3&&tries<400)continue;
  dead.sort((a,b)=>g.get(b).d-g.get(a).d);const bossK=dead[0];if(g.get(bossK).d<3&&tries<400)continue;
  // boss room must not touch the start room
  const rest=R.shuffle(dead.slice(1));const treasK=rest[0],shopK=rest[1];
  const rooms=[];const idOf=new Map();for(const[k,c]of g){const r={id:rooms.length,gx:c.gx,gy:c.gy,dist:c.d,kind:k==key(sx,sy)?'start':k==bossK?'boss':k==treasK?'treasure':k==shopK?'shop':'normal',doors:{},secretDoors:{},seed:R.int(1e9)};idOf.set(k,r.id);rooms.push(r)}
  for(const r of rooms)for(const d in DIRS){const[dx,dy]=DIRS[d];const k=key(r.gx+dx,r.gy+dy);if(idOf.has(k))r.doors[d]=idOf.get(k)}
  // secret room: empty cell touching the most rooms (not the boss room)
  let best=null,bestN=0;for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){if(g.has(key(x,y)))continue;let n=0,bad=false;for(const d in DIRS){const[dx,dy]=DIRS[d];const k=key(x+dx,y+dy);if(g.has(k)){if(k==bossK)bad=true;n++}}
   if(!bad&&n>bestN+(R()<.3?0:0)){best=[x,y];bestN=n}}
  if(best){const s={id:rooms.length,gx:best[0],gy:best[1],dist:99,kind:'secret',doors:{},secretDoors:{},seed:R.int(1e9)};rooms.push(s);
   for(const d in DIRS){const[dx,dy]=DIRS[d];const k=key(s.gx+dx,s.gy+dy);if(idOf.has(k)){const o=rooms[idOf.get(k)];s.secretDoors[d]=o.id;o.secretDoors[OPP[d]]=s.id}}}
  for(const r of rooms)fillRoom(r,floor,R,pool,used);
  return{seed,floor,rooms,start:idOf.get(key(sx,sy)),boss:idOf.get(bossK),tries}}}
function reachable(grid,from){const seen=new Uint8Array(91),q=[from];seen[from[1]*13+from[0]]=1;let n=0;
 while(q.length){const[x,y]=q.pop();n++;for(const[dx,dy]of Object.values(DIRS)){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>12||ny>6)continue;const i=ny*13+nx;if(seen[i]||grid[i])continue;seen[i]=1;q.push([nx,ny])}}return seen}
function makeLayout(R,kind){if(kind!='normal'){const grid=new Uint8Array(91);if(kind=='boss'){for(const[x,y]of[[1,1],[11,1],[1,5],[11,5]])grid[y*13+x]=2}return grid}
 for(let attempt=0;attempt<12;attempt++){const grid=new Uint8Array(91);const t=R()<.35?null:R.pick(TEMPLATES);const prop=R()<.25?2:1;
  if(t){for(let y=0;y<7;y++)for(let x=0;x<13;x++)if(t[y][x]=='x')grid[y*13+x]=prop}
  else{for(let y=0;y<4;y++)for(let x=0;x<7;x++)if(R()<.12){for(const[mx,my]of[[x,y],[12-x,y],[x,6-y],[12-x,6-y]])grid[my*13+mx]=prop}}
  // keep door lanes clear
  for(const d in DOOR_TILE){const[x,y]=DOOR_TILE[d];grid[y*13+x]=0;const[dx,dy]=DIRS[OPP[d]];grid[(y+dy)*13+x+dx]=0}
  const seen=reachable(grid,DOOR_TILE.n);if(!Object.values(DOOR_TILE).every(([x,y])=>seen[y*13+x]))continue;
  // fill pockets that cannot be reached from the doors (so nothing ever spawns or drops somewhere unreachable)
  let free=0;for(let i=0;i<91;i++){if(!grid[i]&&!seen[i])grid[i]=prop;if(!grid[i])free++}if(free<45)continue;return grid}
 return new Uint8Array(91)}
function centerTile(grid){let best=[6,3],bd=99;for(let y=0;y<7;y++)for(let x=0;x<13;x++){if(grid[y*13+x])continue;const d=Math.abs(x-6)+Math.abs(y-3)*1.2;if(d<bd){bd=d;best=[x,y]}}return best}
function fillRoom(r,floor,R,pool,used){const RR=RNG(r.seed);r.grid=makeLayout(RR,r.kind);r.center=centerTile(r.grid);r.spawns=[];r.pickups=[];r.cleared=r.kind!='normal'&&r.kind!='boss';
 if(r.kind=='normal'){let budget=3+floor+RR.int(2)+(r.dist>3?1:0);const types=Object.keys(ENEMIES).filter(k=>ENEMIES[k].w>0);const free=[];
  for(let y=0;y<7;y++)for(let x=0;x<13;x++){if(r.grid[y*13+x])continue;let ok=true;for(const d in DOOR_TILE){const[dx,dy]=DOOR_TILE[d];if(Math.abs(dx-x)+Math.abs(dy-y)<4)ok=false}if(ok)free.push([x,y])}
  RR.shuffle(free);const theme=RR.pick(types);while(budget>0&&free.length){const tp=RR()<.4?theme:RR.pick(types);const[x,y]=free.pop();r.spawns.push({t:tp,x,y,champ:floor>1&&RR()<.12});budget-=tp=='slop'||tp=='goat'?2:1}}
 if(r.kind=='boss')r.spawns.push({t:'boss',x:6,y:2,boss:floor==1?'fat0':'fat1'});
 const take=()=>{const avail=pool.filter(k=>!used.has(k));const k=avail.length?RR.pick(avail):'crust';used.add(k);return k};
 if(r.kind=='treasure')r.pickups.push({t:'item',id:take(),x:6,y:3,ped:1});
 if(r.kind=='shop'){r.pickups.push({t:'item',id:take(),x:3,y:3,price:15,ped:1},{t:'item',id:take(),x:6,y:3,price:15,ped:1},{t:'item',id:take(),x:9,y:3,price:15,ped:1},{t:'heart',x:6,y:5,price:3,ped:1})}
 if(r.kind=='secret'){for(let i=0;i<7+RR.int(5);i++)r.pickups.push({t:'coin',x:3+RR.int(7),y:2+RR.int(3),v:1,jx:RR.int(10)-5,jy:RR.int(10)-5});if(RR()<.4)r.pickups.push({t:'item',id:take(),x:6,y:3,ped:1})}
}
// validation used by tests (and asserted in dev builds): connectivity, boss reachable, special rooms are dead ends, layouts walkable
function validateFloor(F){const errs=[];const R=F.rooms,main=R.filter(r=>r.kind!='secret');
 if(main.length<8||main.length>12)errs.push('room count '+main.length);
 const seen=new Set([F.start]),q=[F.start];while(q.length){const r=R[q.pop()];for(const d in r.doors){const o=r.doors[d];if(R[o].doors[OPP[d]]!==r.id)errs.push('door mismatch '+r.id+d);if(!seen.has(o)){seen.add(o);q.push(o)}}}
 if(seen.size!=main.length)errs.push('disconnected '+seen.size+'/'+main.length);if(!seen.has(F.boss))errs.push('boss unreachable');
 for(const k of['boss','treasure','shop']){const rs=R.filter(r=>r.kind==k);if(rs.length!=1)errs.push(k+' count '+rs.length);for(const r of rs)if(Object.keys(r.doors).length!=1)errs.push(k+' not dead end')}
 const boss=R[F.boss];if(Object.values(boss.doors).includes(F.start))errs.push('boss next to start');
 for(const r of R){for(const d in r.doors){const[x,y]=DOOR_TILE[d];if(r.grid[y*13+x])errs.push('door blocked '+r.id+d)}
  const seenT=reachable(r.grid,r.center);if(r.grid[r.center[1]*13+r.center[0]])errs.push('center blocked '+r.id);for(const d of Object.keys(r.doors).concat(Object.keys(r.secretDoors))){const[x,y]=DOOR_TILE[d];if(!seenT[y*13+x])errs.push('door unreachable '+r.id+d)}
  for(const s of r.spawns){if(s.t!='boss'&&(r.grid[s.y*13+s.x]||!seenT[s.y*13+s.x]))errs.push('spawn blocked '+r.id)}
  for(const p of r.pickups)if(r.grid[p.y*13+p.x]||!seenT[p.y*13+p.x])errs.push('pickup blocked '+r.id)}
 const sec=R.filter(r=>r.kind=='secret');if(sec.length>1)errs.push('multiple secrets');for(const s of sec){if(!Object.keys(s.secretDoors).length)errs.push('secret orphan');if(Object.values(s.secretDoors).includes(F.boss))errs.push('secret touches boss')}
 return errs}

function solidAt(tx,ty,forPlayer){const run=GS.run,R=run?run.room:GS.hub&&GS.hub.room;if(tx<0||ty<0||tx>=RW||ty>=RH)return true;

  if(R.hubGate&&d=='n'&&forPlayer)return false;return true}
 return R&&R.grid?!!R.grid[(ty-1)*13+tx-1]:false}
function solidPx(x,y,forPlayer){return solidAt(Math.floor(x/TILE),Math.floor(y/TILE),forPlayer)}
function boxHit(x,y,r,forPlayer){if(r<=8)return solidPx(x-r,y-r,forPlayer)||solidPx(x+r,y-r,forPlayer)||solidPx(x-r,y+r,forPlayer)||solidPx(x+r,y+r,forPlayer);
 const n=Math.ceil(2*r/12);for(let i=0;i<=n;i++){const k=-r+2*r*i/n;if(solidPx(x+k,y-r,forPlayer)||solidPx(x+k,y+r,forPlayer)||solidPx(x-r,y+k,forPlayer)||solidPx(x+r,y+k,forPlayer))return true}return false}
function moveBody(o,dx,dy,forPlayer,fly){let hitX=false,hitY=false;const chk=(x,y)=>fly?(x-o.r<TILE||x+o.r>RPW-TILE||y-o.r<TILE||y+o.r>RPH-TILE):boxHit(x,y,o.r,forPlayer);

function flowField(){const run=GS.run,P=run.P;const f=new Int16Array(91).fill(999);const px=clamp(Math.floor(P.x/TILE)-1,0,12),py=clamp(Math.floor(P.y/TILE)-1,0,6);
 const g=run.room.grid;f[py*13+px]=0;const q=[[px,py]];while(q.length){const[x,y]=q.shift();for(const[dx,dy]of Object.values(DIRS)){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>12||ny>6)continue;const i=ny*13+nx;if(g[i]||f[i]<=f[y*13+x]+1)continue;f[i]=f[y*13+x]+1;q.push([nx,ny])}}run.flow=f}
function flowDir(e){const run=GS.run,P=run.P,f=run.flow;const tx=Math.floor(e.x/TILE)-1,ty=Math.floor(e.y/TILE)-1;

  if(g>6)for(let i=0;i<4;i++){const bw=8+FX.int(24),bh=6+FX.int(16),sx=FX.int(LW-bw),sy=FX.int(LH-bh);cx.globalAlpha=.85;cx.drawImage(prevBuf,sx*HD,sy*HD,bw*HD,bh*HD,OX+(sx+(FX()-.5)*12)*SC,OY+sy*SC,bw*SC,bh*SC)}cx.globalAlpha=1}
 else if(GS.t%8==0){pbx.drawImage(buf,0,0)}}
let HURT_O=-1;function drawHurt(){const o=GS.hurtFlash>0?+(GS.hurtFlash/14).toFixed(2):0;if(o!==HURT_O){HURT_O=o;$('hurt').style.opacity=o}}

// ---- touch: floating twin sticks (left MOVE, right AIM + FIRE; tap or hold the right stick to shoot) ----
const TOUCH={l:{on:false,id:null,ox:0,oy:0,vx:0,vy:0,mag:0},r:{on:false,id:null,ox:0,oy:0,vx:0,vy:0,mag:0,t0:0,moved:0,hold:false},tapFire:0,
 reset(){for(const s of[this.l,this.r]){s.on=false;s.id=null;s.vx=s.vy=s.mag=0;s.hold=false}this.tapFire=0;layoutSticks()}};
const JR=50;

function layoutSticks(){for(const side of['l','r']){const s=TOUCH[side],el=$('j'+side);const[x,y]=s.on?[s.ox,s.oy]:idlePos(side);el.style.left=x+'px';el.style.top=y+'px';el.classList.toggle('on',s.on);el.style.opacity=s.on?1:.5;

RESIZE_HOOKS.push(layoutSticks);
function tStart(e){if(!document.body.classList.contains('playing')||GS.mode=='panel')return;let used=false;for(const t of e.changedTouches){if(t.target.closest&&t.target.closest('.tb,.ov'))continue;used=true;
 const side=t.clientX<CW/2?'l':'r',s=TOUCH[side];if(s.on)continue;s.on=true;s.id=t.identifier;

function tMove(e){for(const t of e.changedTouches){for(const side of['l','r']){const s=TOUCH[side];if(!s.on||s.id!==t.identifier)continue;let dx=(t.clientX-s.ox)/JR,dy=(t.clientY-s.oy)/JR;const m=Math.hypot(dx,dy);

  s.ox+=(dx/m)*(m-1)*JR;s.oy+=(dy/m)*(m-1)*JR;dx/=m;dy/=m}const mm=Math.min(1,m);s.mag=mm<.12?0:mm;s.vx=s.mag?dx:0;s.vy=s.mag?dy:0;if(side=='r')s.moved=Math.max(s.moved,Math.hypot(t.clientX-s.ox,t.clientY-s.oy))}}

function tEnd(e){for(const t of e.changedTouches){for(const side of['l','r']){const s=TOUCH[side];if(!s.on||s.id!==t.identifier)continue;

addEventListener('touchstart',tStart,{passive:false});addEventListener('touchmove',tMove,{passive:false});addEventListener('touchend',tEnd);addEventListener('touchcancel',tEnd);
function touchTick(){const r=TOUCH.r;if(r.on&&r.mag<=.28&&performance.now()-r.t0>230)r.hold=true}
$('tPause').addEventListener('click',e=>{e.stopPropagation();pause()});
$('tMap').addEventListener('click',e=>{e.stopPropagation();if(GS.mode=='play')GS.map=!GS.map});
if(IS_TOUCH)document.body.classList.add('touch');

// ---- main loop + test hooks ----
function step(){GS.t++;touchTick();if(GS.banner&&!GS.paused)GS.banner.t++;
 if(pressed('Escape')||pressed('p')){if(GS.mode=='pause')setMode(PREV_MODE);else if(GS.mode=='panel')$('bClose').click();else if(GS.map)GS.map=false;else pause()}
 if((pressed('m')||pressed('Tab'))&&GS.mode=='play')GS.map=!GS.map;
 if(GS.mode=='play'&&GS.run&&!GS.map){if(GS.slide){GS.slide.t+=1/13;if(GS.slide.t>=1)GS.slide=null}else updateRun()}
 else if(GS.mode=='hub'&&GS.hub)updateHub();
 if((GS.mode=='play'&&!GS.map)||GS.mode=='hub')fxStep();
 if(GS.shake>0)GS.shake*=.85,GS.shake<.3&&(GS.shake=0);if(GS.glitch>0)GS.glitch--;if(GS.ca>0)GS.ca--;PRESS.clear()}
// hold-to-fire on touch: aim at the nearest enemy (or keep the last aim)
const _readAim=readAim;readAim=function(){const a=_readAim();if(a)return a;const r=TOUCH.r;if(r.on&&r.hold){const P=GS.run.P,t=nearestTarget(999);if(t){const an=Math.atan2(t.y-P.y,t.x-P.x);return{x:Math.cos(an),y:Math.sin(an),src:'hold'}}return{x:P.aim[0],y:P.aim[1],src:'hold'}}return null};
let ACC=0,LAST=performance.now();
// perf ring buffers (CPU ms per frame for update+render, and rAF interval) -> CR.perfStats()
const PERF={cpu:new Float32Array(600),iv:new Float32Array(600),i:0,n:0};
function frame(t){const iv=t-LAST;ACC+=Math.min(100,iv);LAST=t;const t0=performance.now();let n=0;while(ACC>=1000/60&&n<6){step();ACC-=1000/60;n++}try{render()}catch(e){if(!frame.err){frame.err=String(e&&e.stack||e);console.warn('render',e)}}
 PERF.cpu[PERF.i]=performance.now()-t0;PERF.iv[PERF.i]=iv;PERF.i=(PERF.i+1)%600;PERF.n=Math.min(600,PERF.n+1);requestAnimationFrame(frame)}
function perfStats(reset){const n=PERF.n,c=Array.from(PERF.cpu.slice(0,n)).sort((a,b)=>a-b),v=Array.from(PERF.iv.slice(0,n)).sort((a,b)=>a-b);const avg=a=>a.reduce((x,y)=>x+y,0)/Math.max(1,a.length);
 const r={frames:n,cpuAvg:+avg(c).toFixed(2),cpuP95:+(c[Math.floor(n*.95)]||0).toFixed(2),cpuMax:+(c[n-1]||0).toFixed(2),intervalAvg:+avg(v).toFixed(2),fps:+(1000/Math.max(1,avg(v))).toFixed(1)};if(reset){PERF.n=0;PERF.i=0}return r}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&GS.mode=='play')pause()});
resize();layoutSticks();playSong('title');requestAnimationFrame(frame);

 step:(n=1)=>{for(let i=0;i<n;i++)step()},killAll(){const r=GS.run;if(!r)return;for(const e of r.ents)if(!e.boss&&!e.dead)killEnemy(e)},
 goto(id){const r=GS.run;r.room.cleared=true;enterRoom(id,null);GS.slide=null},layout:()=>({LW,ROOMX,ROOMY,SC,OX,OY,DPR}),TOUCH,giveItem:(id)=>giveItem(GS.run.P,id),setMode,perfStats,render,get renderErr(){return frame.err||null}};
