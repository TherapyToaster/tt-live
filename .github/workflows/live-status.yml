# .github/workflows/live-status.yml in a public repo with GitHub Pages enabled (Pages serves Access-Control-Allow-Origin: *)
name: spaces-live-status
on: {schedule: [{cron: '*/5 * * * *'}], workflow_dispatch: {}}
permissions: {contents: write}
concurrency: live-status
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 check_space.py
        env: {X_BEARER_TOKEN: '${{ secrets.X_BEARER_TOKEN }}'}
      - run: |
          git config user.name live-bot; git config user.email live-bot@users.noreply.github.com
          git add status.json; git commit -m "status $(date -u +%FT%TZ)" || true; git push
