<!-- Therapy Toaster floating merch — paste into a Squarespace Code block on /shop.
     The canvases attach to document.body (position:fixed, pointer-events:none)
     so they will not trap clicks or get clipped by the Code block.
     Edit the JSON below to change images, accent, or turn dots off. -->
<div id="tt-float-root" style="height:0;margin:0;padding:0;overflow:visible;" aria-hidden="true"></div>
<script type="application/json" id="tt-float-config">
{
  "accent": "#FFD400",
  "dots": true,
  "zIndex": 8
}
</script>
<script>
/* TTFloat — floating merch cutouts for Therapy Toaster.
   Recreates the ecoay.com field+dots feel with no libraries:
   collage-like product cutouts (smaller) drift and sway, yellow dots
   part around the pointer and the pieces, pieces push away on hover
   or touch and can be dragged and thrown. When a piece overlaps text
   or interactive content it fades to ~28% opacity, then returns over
   empty background. Canvases are pointer-events: none so clicks
   pass through to the shop underneath.
   Config: window.TT_FLOAT = { items, accent, dots, zIndex, knockout }
   or a JSON script#tt-float-config element.
*/
(function (global) {
  "use strict";

  var ACCENT = "#FFD400";
  var DEFAULT_ITEMS = [
    {
      src: "https://cdn.jsdelivr.net/gh/TherapyToaster/tt-live@ca8f8599458c7f338dea3c1a234d2e593feb8888/paste/0810/tt-vc-skull-v5.png",
      size: 94,
      knockout: false
    },
    {
      src: "https://therapytoaster.myshopify.com/cdn/shop/files/shirt15-blend-mockup.png?v=1793769469&width=600",
      size: 125
    },
    {
      src: "https://cdn.shopify.com/s/files/1/0787/6860/3190/files/please-be-nice-tee-mockup_800x800.png?v=1793004173",
      size: 125
    },
    {
      src: "https://cdn.shopify.com/s/files/1/0787/6860/3190/files/let-it-tee-mockup_800x800.png?v=1793419628",
      size: 125
    },
    {
      src: "https://therapytoaster.github.io/tt-live/shop/skull-butter-tee.png?v=1",
      size: 119
    },
    {
      src: "https://cdn.shopify.com/s/files/1/0787/6860/3190/files/kiss-cut-stickers-white-3x3-default-6aebb4462147d.jpg?v=1793832015",
      size: 106
    },
    {
      src: "https://cdn.shopify.com/s/files/1/0787/6860/3190/files/embroidered-patches-black-rectangle-3.5x2.25-front-6aedac9540006.jpg?v=1793961113",
      size: 100
    }
  ];

  var mounted = null;

  function clamp(n, a, b) {
    return n < a ? a : n > b ? b : n;
  }

  function knockOut(img) {
    var max = 512;
    var scale = Math.min(1, max / Math.max(img.width, img.height));
    var w = Math.max(1, Math.round(img.width * scale));
    var h = Math.max(1, Math.round(img.height * scale));
    var c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    var ctx = c.getContext("2d");
    if (!ctx) return img;
    ctx.drawImage(img, 0, 0, w, h);
    var imageData;
    try {
      imageData = ctx.getImageData(0, 0, w, h);
    } catch (err) {
      return img;
    }
    var d = imageData.data;
    var i, a, count = 0, transparent = 0;
    for (i = 3; i < d.length; i += 16) {
      count++;
      if (d[i] < 10) transparent++;
    }
    if (count && transparent / count > 0.12) return c;

    function sample(x, y) {
      var p = (y * w + x) * 4;
      return [d[p], d[p + 1], d[p + 2], d[p + 3]];
    }
    var corners = [sample(1, 1), sample(w - 2, 1), sample(1, h - 2), sample(w - 2, h - 2)];
    var br = 0, bg = 0, bb = 0, n = 0;
    corners.forEach(function (c4) {
      if (c4[3] < 10) return;
      br += c4[0];
      bg += c4[1];
      bb += c4[2];
      n++;
    });
    if (!n) return c;
    br /= n;
    bg /= n;
    bb /= n;
    var tol = 36;
    if (br < 180 && bg < 180 && bb < 180) tol = 24;

    function close(p) {
      return (
        Math.abs(d[p] - br) <= tol &&
        Math.abs(d[p + 1] - bg) <= tol &&
        Math.abs(d[p + 2] - bb) <= tol
      );
    }

    var seen = new Uint8Array(w * h);
    var q = [];
    function push(x, y) {
      if (x < 0 || y < 0 || x >= w || y >= h) return;
      var idx = y * w + x;
      if (seen[idx]) return;
      var p = idx * 4;
      if (!close(p)) return;
      seen[idx] = 1;
      q.push(idx);
    }
    var x, y;
    for (x = 0; x < w; x++) {
      push(x, 0);
      push(x, h - 1);
    }
    for (y = 0; y < h; y++) {
      push(0, y);
      push(w - 1, y);
    }
    while (q.length) {
      var idx = q.pop();
      var cx = idx % w;
      var cy = (idx - cx) / w;
      d[idx * 4 + 3] = 0;
      push(cx - 1, cy);
      push(cx + 1, cy);
      push(cx, cy - 1);
      push(cx, cy + 1);
    }
    // Feather the cut edge so it doesn't look punched.
    var copy = new Uint8ClampedArray(d);
    for (y = 1; y < h - 1; y++) {
      for (x = 1; x < w - 1; x++) {
        var p = (y * w + x) * 4;
        if (copy[p + 3] === 0) continue;
        var empty = 0;
        if (copy[((y - 1) * w + x) * 4 + 3] === 0) empty++;
        if (copy[((y + 1) * w + x) * 4 + 3] === 0) empty++;
        if (copy[(y * w + x - 1) * 4 + 3] === 0) empty++;
        if (copy[(y * w + x + 1) * 4 + 3] === 0) empty++;
        if (empty) d[p + 3] = Math.max(0, d[p + 3] - empty * 50);
      }
    }
    ctx.putImageData(imageData, 0, 0);
    return c;
  }

  function loadItem(spec) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function () {
        var sprite = spec.knockout === false ? img : knockOut(img);
        resolve({
          sprite: sprite,
          size: spec.size || 112,
          href: spec.href || "",
          iw: sprite.width || img.width,
          ih: sprite.height || img.height
        });
      };
      img.onerror = function () {
        resolve(null);
      };
      img.src = spec.src;
    });
  }

  function seedItem(it, w, h, randomize) {
    it.lane = Math.random();
    it.progress = randomize ? Math.random() : 0;
    it.drift = (Math.random() - 0.5) * 0.5;
    it.sway = 12 + Math.random() * 36;
    it.phase = Math.random() * Math.PI * 2;
    it.speed = 0.018 + Math.random() * 0.016;
    it.spin = (Math.random() - 0.5) * 0.16;
    it.baseAngle = (Math.random() - 0.5) * 0.7;
    it.vx = 0;
    it.vy = 0;
    it.ox = 0;
    it.oy = 0;
    if (it.alpha == null) it.alpha = 1;
  }

  function mount(opts) {
    if (mounted && mounted.destroy) mounted.destroy();
    opts = opts || {};
    var accent = opts.accent || ACCENT;
    var showDots = opts.dots !== false;
    var zIndex = opts.zIndex == null ? 8 : opts.zIndex;
    var itemSpecs = opts.items && opts.items.length ? opts.items : DEFAULT_ITEMS;
    var reduced = matchMedia("(prefers-reduced-motion: reduce)");

    var layer = document.createElement("div");
    layer.id = "tt-float-layer";
    layer.setAttribute("aria-hidden", "true");
    layer.style.cssText =
      "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:" +
      zIndex +
      ";overflow:hidden;";
    var canvas = document.createElement("canvas");
    canvas.style.cssText = "width:100%;height:100%;display:block;";
    layer.appendChild(canvas);
    document.body.appendChild(layer);
    var ctx = canvas.getContext("2d");
    if (!ctx) return { destroy: function () {} };

    var W = 0, H = 0, dpr = 1;
    var items = [];
    var dots = [];
    var pointer = { x: -9999, y: -9999, down: false, px: 0, py: 0, pvx: 0, pvy: 0 };
    var dragging = null;
    var dragMoved = false;
    var raf = 0;
    var last = 0;
    var time = 0;
    var ready = false;
    var destroyed = false;
    var touchGuard = null;
    var coverRects = [];
    var coverScheduled = false;
    var COVER_SEL = "h1,h2,h3,h4,h5,h6,p,a,button,label,li,dt,dd,input,select,textarea,summary,[role='button'],[role='link'],img,picture,.price,.product-price,.product-title,.product__title,.card-title,[class*='price'],[class*='product-title'],[class*='product__title']";
    var FADE = 0.28;

    function resize() {
      W = innerWidth;
      H = innerHeight;
      dpr = Math.min(devicePixelRatio || 1, navigator.connection && navigator.connection.saveData ? 1 : 1.5);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (showDots) {
        var n = Math.round((W * H) / (W < 820 ? 14000 : 10000));
        n = clamp(n, 40, 180);
        dots = Array.from({ length: n }, function (_, i) {
          return {
            x: Math.random() * W,
            y: Math.random() * H,
            vx: 0,
            vy: 0,
            r: 1 + Math.random() * 1.6,
            a: 0.28 + Math.random() * 0.45,
            seed: Math.random() * 100
          };
        });
      }
    }

    function metrics(it) {
      var mobile = W < 820;
      var maxW = mobile
        ? Math.min(it.size * 0.55, W * 0.26, 110)
        : Math.min(it.size, W * 0.12, 145);
      var dw = maxW;
      var dh = (maxW * it.ih) / it.iw;
      return { dw: dw, dh: dh, r: Math.hypot(dw, dh) / 4 + 6 };
    }

    function floatPos(it) {
      var m = metrics(it);
      var margin = Math.max(m.dw, m.dh) * 0.55 + 12;
      var o = time * 0.32 + it.phase;
      var g = ((it.progress - 0.5) * W * it.drift + Math.sin(o) * it.sway);
      var x = -margin + it.lane * (W + margin * 2) + g;
      var y = reduced.matches
        ? clamp(H * it.progress, margin, H - margin)
        : -margin + it.progress * (H + margin * 2);
      return { x: x + it.ox, y: y + it.oy, angle: it.baseAngle + time * it.spin + Math.sin(o * 0.7) * 0.05, dw: m.dw, dh: m.dh, r: m.r };
    }

    function refreshCoverRects() {
      coverRects = [];
      var nodes = document.querySelectorAll(COVER_SEL);
      for (var i = 0; i < nodes.length; i++) {
        var el = nodes[i];
        if (layer.contains(el)) continue;
        var r = el.getBoundingClientRect();
        if (r.width < 8 || r.height < 8) continue;
        coverRects.push({ l: r.left, t: r.top, r: r.right, b: r.bottom });
      }
    }

    function scheduleCoverRefresh() {
      if (coverScheduled) return;
      coverScheduled = true;
      requestAnimationFrame(function () {
        coverScheduled = false;
        refreshCoverRects();
        if (reduced.matches) draw();
      });
    }

    function overlapsCover(p) {
      var l = p.x - p.r, t = p.y - p.r, r = p.x + p.r, b = p.y + p.r;
      for (var i = 0; i < coverRects.length; i++) {
        var c = coverRects[i];
        if (l < c.r && r > c.l && t < c.b && b > c.t) return true;
      }
      return false;
    }

    function updateAlpha(it, p, dt) {
      var target = overlapsCover(p) ? FADE : 1;
      if (it.alpha == null) it.alpha = 1;
      if (reduced.matches) it.alpha = target;
      else it.alpha += (target - it.alpha) * Math.min(1, (dt || 0.032) * 10);
    }

    function pinItem(it, x, y) {
      var p = floatPos(it);
      it.ox += x - p.x;
      it.oy += y - p.y;
      it.vx = it.vy = 0;
      it.speed = 0;
    }

    function applyPreviewPins() {
      var preview =
        opts.preview ||
        (typeof location !== "undefined" &&
          /(?:\?|&)ttfloat_preview=1(?:&|$)/.test(location.search));
      if (!preview || !items.length) return;
      var heading = document.querySelector("h1");
      var over = items[2] || items[0];
      if (heading) {
        var r = heading.getBoundingClientRect();
        pinItem(over, r.left + r.width * 0.62, r.top + r.height * 0.55);
      }
      if (items[0] && items[0] !== over) {
        pinItem(items[0], W * 0.5, H * 0.84);
      }
      refreshCoverRects();
      items.forEach(function (it) {
        updateAlpha(it, floatPos(it), 1);
      });
    }

    function hitItem(x, y) {
      for (var i = items.length - 1; i >= 0; i--) {
        var p = floatPos(items[i]);
        if (Math.hypot(x - p.x, y - p.y) < p.r * 1.35) return items[i];
      }
      return null;
    }

    function step(dt) {
      var i, it, p, dx, dy, dist, force, m;
      time += dt;
      if (!reduced.matches) {
        for (i = 0; i < items.length; i++) {
          it = items[i];
          if (it !== dragging) {
            it.progress += dt * it.speed;
            if (it.progress > 1) {
              seedItem(it, W, H, false);
              it.progress = 0;
            }
            it.ox += it.vx;
            it.oy += it.vy;
            it.vx *= 0.92;
            it.vy *= 0.92;
            it.ox *= 0.995;
            it.oy *= 0.995;
            p = floatPos(it);
            dx = p.x - pointer.x;
            dy = p.y - pointer.y;
            dist = Math.hypot(dx, dy);
            var radius = p.r + 90;
            if (dist < radius && dist > 0.01) {
              force = Math.pow((radius - dist) / radius, 2) * 14;
              it.vx += (dx / dist) * force * dt * 60;
              it.vy += (dy / dist) * force * dt * 60;
            }
          }
        }
        // soft collisions
        for (i = 0; i < items.length; i++) {
          for (var j = i + 1; j < items.length; j++) {
            var a = floatPos(items[i]);
            var b = floatPos(items[j]);
            dx = b.x - a.x;
            dy = b.y - a.y;
            dist = Math.hypot(dx, dy);
            var min = a.r + b.r;
            if (dist < min && dist > 0.01) {
              force = ((min - dist) / min) * 0.6;
              var fx = (dx / dist) * force;
              var fy = (dy / dist) * force;
              if (items[i] !== dragging) {
                items[i].vx -= fx;
                items[i].vy -= fy;
              }
              if (items[j] !== dragging) {
                items[j].vx += fx;
                items[j].vy += fy;
              }
            }
          }
        }
      }

      if (showDots && !reduced.matches) {
        for (i = 0; i < dots.length; i++) {
          var d = dots[i];
          var flowX = 0.28 + Math.sin(d.y * 0.004 + time * 0.4 + d.seed) * 0.22;
          var flowY = 0.1 + Math.cos(d.x * 0.003 + time * 0.3 + d.seed) * 0.18;
          d.vx += (flowX - d.vx) * 0.04;
          d.vy += (flowY - d.vy) * 0.04;
          for (j = 0; j < items.length; j++) {
            p = floatPos(items[j]);
            dx = d.x - p.x;
            dy = d.y - p.y;
            dist = Math.hypot(dx, dy);
            var ir = p.r + 60;
            if (dist < ir && dist > 0.01) {
              force = Math.pow((ir - dist) / ir, 2) * 5;
              d.vx += (dx / dist) * force;
              d.vy += (dy / dist) * force;
            }
          }
          dx = d.x - pointer.x;
          dy = d.y - pointer.y;
          dist = Math.hypot(dx, dy);
          if (dist < 90 && dist > 0.01) {
            force = Math.pow((90 - dist) / 90, 2) * 4;
            d.vx += (dx / dist) * force;
            d.vy += (dy / dist) * force;
          }
          d.vx *= 0.9;
          d.vy *= 0.9;
          d.x += d.vx * dt * 60;
          d.y += d.vy * dt * 60;
          if (d.x > W + 4) d.x -= W + 8;
          else if (d.x < -4) d.x += W + 8;
          if (d.y > H + 4) d.y -= H + 8;
          else if (d.y < -4) d.y += H + 8;
        }
      }
    }

    function draw(dt) {
      ctx.clearRect(0, 0, W, H);
      var i, p;
      if (showDots) {
        ctx.fillStyle = accent;
        for (i = 0; i < dots.length; i++) {
          var d = dots[i];
          ctx.globalAlpha = d.a;
          ctx.beginPath();
          ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      for (i = 0; i < items.length; i++) {
        p = floatPos(items[i]);
        updateAlpha(items[i], p, dt);
        ctx.save();
        ctx.globalAlpha = items[i].alpha;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.shadowColor = "rgba(0,0,0,0.55)";
        ctx.shadowBlur = 14;
        ctx.shadowOffsetY = 6;
        ctx.drawImage(items[i].sprite, -p.dw / 2, -p.dh / 2, p.dw, p.dh);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    function loop(now) {
      raf = 0;
      if (destroyed || document.hidden) return;
      if (!last) last = now;
      if (now - last >= 32) {
        var dt = Math.min((now - last) / 1000, 0.08);
        last = now;
        if (!reduced.matches) step(dt);
        draw(dt);
      }
      if (!reduced.matches) raf = requestAnimationFrame(loop);
    }

    function startLoop() {
      cancelAnimationFrame(raf);
      last = 0;
      draw();
      if (!document.hidden && !reduced.matches) raf = requestAnimationFrame(loop);
    }

    function onPointerMove(e) {
      var x = e.clientX;
      var y = e.clientY;
      pointer.pvx = x - pointer.px;
      pointer.pvy = y - pointer.py;
      pointer.px = pointer.x = x;
      pointer.py = pointer.y = y;
      if (dragging) {
        var p = floatPos(dragging);
        var targetX = x;
        var targetY = y;
        dragging.ox += targetX - p.x;
        dragging.oy += targetY - p.y;
        dragging.vx = pointer.pvx;
        dragging.vy = pointer.pvy;
        if (Math.hypot(pointer.pvx, pointer.pvy) > 1) dragMoved = true;
      }
    }

    function onPointerDown(e) {
      if (e.button != null && e.button !== 0) return;
      pointer.down = true;
      pointer.px = pointer.x = e.clientX;
      pointer.py = pointer.y = e.clientY;
      var hit = hitItem(e.clientX, e.clientY);
      if (!hit) return;
      dragging = hit;
      dragMoved = false;
      if (e.pointerType === "touch" && !touchGuard) {
        touchGuard = function (ev) {
          if (dragging && dragMoved) ev.preventDefault();
        };
        document.addEventListener("touchmove", touchGuard, { passive: false });
      }
    }

    function onPointerUp() {
      if (dragging && dragMoved) {
        dragging.vx = clamp(pointer.pvx, -42, 42);
        dragging.vy = clamp(pointer.pvy, -42, 42);
        var sink = function (ev) {
          ev.stopPropagation();
          ev.preventDefault();
        };
        document.addEventListener("click", sink, { capture: true, once: true });
        setTimeout(function () {
          document.removeEventListener("click", sink, { capture: true });
        }, 400);
      }
      dragging = null;
      pointer.down = false;
      if (touchGuard) {
        document.removeEventListener("touchmove", touchGuard, { passive: false });
        touchGuard = null;
      }
    }

    function onLeave() {
      if (!pointer.down) pointer.x = pointer.y = -9999;
    }

    Promise.all(itemSpecs.map(loadItem)).then(function (loaded) {
      if (destroyed) return;
      items = loaded.filter(Boolean);
      items.forEach(function (it) {
        seedItem(it, W, H, true);
      });
      ready = true;
      resize();
      refreshCoverRects();
      applyPreviewPins();
      startLoop();
    });

    function onResize() {
      resize();
      refreshCoverRects();
      draw();
    }
    function onScroll() {
      scheduleCoverRefresh();
    }
    resize();
    addEventListener("pointermove", onPointerMove, { passive: true });
    addEventListener("pointerdown", onPointerDown, { passive: true });
    addEventListener("pointerup", onPointerUp, { passive: true });
    addEventListener("pointercancel", onPointerUp, { passive: true });
    addEventListener("pointerleave", onLeave, { passive: true });
    addEventListener("resize", onResize, { passive: true });
    addEventListener("scroll", onScroll, { passive: true });
    document.addEventListener("visibilitychange", startLoop);
    reduced.addEventListener("change", startLoop);
    refreshCoverRects();

    mounted = {
      destroy: function () {
        destroyed = true;
        cancelAnimationFrame(raf);
        removeEventListener("pointermove", onPointerMove, { passive: true });
        removeEventListener("pointerdown", onPointerDown, { passive: true });
        removeEventListener("pointerup", onPointerUp, { passive: true });
        removeEventListener("pointercancel", onPointerUp, { passive: true });
        removeEventListener("pointerleave", onLeave, { passive: true });
        removeEventListener("resize", onResize, { passive: true });
        removeEventListener("scroll", onScroll, { passive: true });
        document.removeEventListener("visibilitychange", startLoop);
        reduced.removeEventListener("change", startLoop);
        if (touchGuard) document.removeEventListener("touchmove", touchGuard, { passive: false });
        if (layer.parentNode) layer.parentNode.removeChild(layer);
        if (mounted === this) mounted = null;
      }
    };
    return mounted;
  }

  function readConfig() {
    var cfg = global.TT_FLOAT ? Object.assign({}, global.TT_FLOAT) : {};
    var el = document.getElementById("tt-float-config");
    if (el) {
      try {
        Object.assign(cfg, JSON.parse(el.textContent));
      } catch (err) {}
    }
    return cfg;
  }

  function auto() {
    if (global.TT_FLOAT && global.TT_FLOAT.auto === false) return;
    if (mounted) return;
    mount(readConfig());
  }

  global.TTFloat = {
    mount: mount,
    defaultItems: DEFAULT_ITEMS,
    accent: ACCENT
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", auto);
  } else {
    auto();
  }
})(window);

  </script>
