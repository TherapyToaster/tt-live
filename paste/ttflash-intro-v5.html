<!-- TherapyToaster intro v5: 404 ToaSty landscape 6s / contain / tHard 7200 -->
<style>
#ttflash-ov{position:fixed;inset:0;z-index:2147483647;background:#000;color:#FFD400;overflow:hidden;opacity:1;transition:opacity .22s ease;font-family:monospace}
#ttflash-ov.ttflash-out{opacity:0;pointer-events:none}
#ttflash-ov canvas.ttflash-rain{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
#ttflash-ov.ttflash-raining{background:transparent}
#ttflash-ov.ttflash-rainfx .ttflash-controls{opacity:0;pointer-events:none;transition:opacity .2s}
#ttflash-ov video,#ttflash-ov .ttflash-still{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#ttflash-ov video{opacity:0;transition:opacity .07s linear;object-fit:contain}
#ttflash-ov.ttflash-playing video{opacity:1}
#ttflash-ov.ttflash-playing .ttflash-still{visibility:hidden}
#ttflash-ov .ttflash-still{animation:ttflash-static .32s steps(1,end) both}
#ttflash-ov .ttflash-controls{position:absolute;z-index:2;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:14px;padding:0 12px}
#ttflash-ov button{appearance:none;border:1px solid #FFD400;background:rgba(0,0,0,.82);color:#FFD400;font:700 12px/1.2 monospace;letter-spacing:.05em;text-transform:uppercase;padding:12px 15px;min-height:44px;cursor:pointer;box-shadow:3px 3px 0 rgba(255,212,0,.2)}
#ttflash-ov button:hover,#ttflash-ov button:focus-visible{background:#FFD400;color:#000;outline:2px solid #FFD400;outline-offset:3px}
@media(max-width:767px){#ttflash-ov video{object-fit:contain}}
@keyframes ttflash-static{0%{transform:translateX(-5px);filter:drop-shadow(5px 0 #f03) drop-shadow(-5px 0 #0ff)}25%{transform:translateX(4px);clip-path:inset(7% 0 5%)}50%{transform:none;clip-path:inset(0);filter:none}75%{transform:translateX(-3px);filter:drop-shadow(3px 0 #f03)}100%{transform:none;filter:none}}
@media(prefers-reduced-motion:reduce){#ttflash-ov{display:none}}
</style>
<script>
(function(){
  'use strict';
  if(!/^\/(?:home\/?)?$/.test(location.pathname))return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var K='ttflash-seen';
  try{if(sessionStorage.getItem(K))return;sessionStorage.setItem(K,'1')}catch(e){}
  if(document.getElementById('ttflash-ov'))return;
  var BASE='https://cdn.jsdelivr.net/gh/TherapyToaster/tt-live@main/site-intro/';
  var ov=document.createElement('div');ov.id='ttflash-ov';
  ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','M®ToaSty site intro');
  ov.innerHTML='<video muted playsinline preload="auto" poster="'+BASE+'home-intro-v2-poster.jpg" aria-label="M®ToaSty intro video"><source src="'+BASE+'home-intro-v2.mp4" type="video/mp4"></video>'+
    '<div class="ttflash-controls"><button type="button" class="ttflash-sound" aria-pressed="false">Tap for sound</button><button type="button" class="ttflash-skip">Skip</button></div>';
  var v=ov.querySelector('video'),sound=ov.querySelector('.ttflash-sound'),skip=ov.querySelector('.ttflash-skip');
  var done=false,started=false,tFlash,tBlocked,tHard,prevFocus,oldOverflow;
  v.muted=true;v.defaultMuted=true;v.playsInline=true;
  var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches,raining=false,raf=0,cv=null;
  function finish(){
    if(done)return;done=true;cancelAnimationFrame(raf);
    clearTimeout(tFlash);clearTimeout(tBlocked);clearTimeout(tHard);
    try{v.pause()}catch(e){}v.muted=true;
    ov.classList.add('ttflash-out');document.removeEventListener('keydown',keys,true);
    if(document.body)document.body.style.overflow=oldOverflow;
    setTimeout(function(){if(cv){cv.width=cv.height=0;cv=null}ov.remove();if(prevFocus&&prevFocus.isConnected&&prevFocus.focus)prevFocus.focus({preventScroll:true})},240);
  }
  function end(fast){
    if(done)return;
    if(raining){if(fast===true)finish();return}
    if(RM||!started||fast===true&&!started){finish();return}
    raining=true;clearTimeout(tHard);tHard=setTimeout(finish,2300);
    try{v.pause()}catch(e){}v.muted=true;rain(fast===true);
  }
  function rain(quick){
    var c=document.createElement('canvas');c.className='ttflash-rain';cv=c;
    var ctx=c.getContext('2d');if(!ctx){finish();return}
    var dpr=Math.min(window.devicePixelRatio||1,2),W=ov.clientWidth||innerWidth,H=ov.clientHeight||innerHeight;
    c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);ctx.scale(dpr,dpr);
    var fs=W<768?14:18,cols=Math.ceil(W/fs),rows=Math.ceil(H/fs)+1,T=quick?700:1600,IN=quick?.15:.42,i;
    var y=[],sp=[],clr=[];
    for(i=0;i<cols;i++){y[i]=-Math.random()*rows*.6;sp[i]=(rows*1.15)/(T*.55)*(0.7+Math.random()*.6);clr[i]=IN+Math.random()*.22}
    var hold=document.createElement('canvas');hold.width=c.width;hold.height=c.height;var hx=hold.getContext('2d');hx.scale(dpr,dpr);
    ov.appendChild(c);ov.classList.add('ttflash-rainfx');var bare=false;
    var t0=performance.now(),last=t0;
    ctx.font='700 '+fs+'px monospace';ctx.textBaseline='top';
    function frame(now){
      if(done)return;var t=(now-t0)/T,dt=now-last;last=now;
      if(t>=1){finish();return}
      if(!bare&&t>=IN){bare=true;ov.classList.add('ttflash-raining');v.style.visibility='hidden'}
      // video dissolves under the code
      v.style.opacity=String(Math.max(0,1-t/IN));v.style.filter='sepia(1) saturate(4) hue-rotate(-8deg) brightness('+(1-t*.6)+')';
      // trail fade on offscreen buffer
      hx.globalCompositeOperation='destination-out';hx.fillStyle='rgba(0,0,0,'+Math.min(1,.12*dt/16)+')';hx.fillRect(0,0,W,H);
      hx.globalCompositeOperation='source-over';hx.font=ctx.font;hx.textBaseline='top';
      for(var k=0;k<cols;k++){
        y[k]+=sp[k]*dt;var r=Math.floor(y[k]);if(r<0)continue;
        var g=Math.random()<.5?'0':'1',x=k*fs;
        hx.fillStyle='rgba(255,212,0,.55)';hx.fillText(Math.random()<.5?'0':'1',x,(r-1)*fs);
        hx.fillStyle='#FFF6B0';hx.shadowColor='#FFD400';hx.shadowBlur=8;hx.fillText(g,x,r*fs);hx.shadowBlur=0;
        if(r>rows&&t<IN+.1)y[k]=-Math.random()*6;
      }
      ctx.clearRect(0,0,W,H);
      // black backdrop that wipes away top-down per column after IN, revealing Home
      ctx.fillStyle='#000';
      for(k=0;k<cols;k++){
        var p=Math.max(0,(t-clr[k])/(1-clr[k])),top=H*Math.min(1,p*1.25),a=t<IN?t/IN:1;
        ctx.globalAlpha=a;ctx.fillRect(k*fs,top,fs+1,H-top);
        ctx.globalAlpha=1;ctx.save();ctx.beginPath();ctx.rect(k*fs,top-fs*4,fs+1,H);ctx.clip();
        ctx.globalAlpha=Math.max(0,1-p*1.1);ctx.drawImage(hold,0,0,W,H);ctx.restore();
      }
      ctx.globalAlpha=1;
      raf=requestAnimationFrame(frame);
    }
    raf=requestAnimationFrame(frame);
  }
  function keys(e){
    if(e.key==='Escape'){e.preventDefault();end(true)}
    if(e.key==='Tab'){e.preventDefault();(document.activeElement===sound?skip:sound).focus({preventScroll:true})}
  }
  v.addEventListener('playing',function(){if(done)return;started=true;clearTimeout(tBlocked);ov.classList.add('ttflash-playing')});
  v.addEventListener('ended',function(){end()});v.addEventListener('error',function(){finish()});
  skip.addEventListener('click',function(e){e.stopPropagation();end(true)});
  ov.addEventListener('click',function(e){if(!e.target.closest('button'))end(true)});
  sound.addEventListener('click',function(){
    if(done)return;v.muted=!v.muted;sound.textContent=v.muted?'Tap for sound':'Mute';sound.setAttribute('aria-pressed',String(!v.muted));
    var p=v.play();if(p&&p.catch)p.catch(function(){finish()});
  });
  function mount(){
    if(done)return;prevFocus=document.activeElement;oldOverflow=document.body.style.overflow;
    document.body.appendChild(ov);document.body.style.overflow='hidden';skip.focus({preventScroll:true});
    document.addEventListener('keydown',keys,true);
    tHard=setTimeout(function(){end(true)},7200);
    tFlash=setTimeout(function(){
      if(done)return;
      tBlocked=setTimeout(function(){if(!started)finish()},950);
      var p;try{p=v.play()}catch(e){setTimeout(finish,900);return}
      if(p&&p.catch)p.catch(function(){setTimeout(finish,900)});
    },0);
  }
  if(document.body)mount();else document.addEventListener('DOMContentLoaded',mount,{once:true});
})();
</script>
