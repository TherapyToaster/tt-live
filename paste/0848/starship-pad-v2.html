<script>
(function(){
  var b=document.getElementById('ttpop-btn'),
      wrap=b&&b.closest('.ttpop-wrap'),
      r=document.getElementById('ttpop-ride'),
      sub=document.getElementById('ttpop-sub'),
      fl=document.getElementById('ttpop-fl'),
      steam=document.getElementById('ttpop-steam');
  if(!b||!r||!wrap)return;
  var sm=document.getElementById('ttpop-smoke');
  if(!sm){sm=document.createElement('div');sm.id='ttpop-smoke';sm.setAttribute('aria-hidden','true');document.body.appendChild(sm)}
  var home=r.parentNode,busy=0,idle=sub?sub.textContent:'Click to launch · Starbase Toasty';
  var IGN=1000,END=5000,OUT=5600;
  function vents(){
    if(!steam||steam.dataset.on)return;steam.dataset.on=1;
    var spots=[[.40,.84],[.46,.86],[.52,.84],[.36,.87],[.58,.88],[.31,.83],[.72,.76],[.74,.66],[.70,.58],[.42,.90],[.50,.91],[.62,.86]];
    spots.forEach(function(s,i){
      var v=document.createElement('i');v.className='ttpop-vent';
      v.style.left=(s[0]*100)+'%';v.style.top=(s[1]*100)+'%';
      v.style.setProperty('--vx',((s[0]<.6?-1:1)*(20+Math.random()*50))+'px');
      v.style.setProperty('--vy',(-40-Math.random()*70)+'px');
      v.style.setProperty('--vs',(1.6+Math.random()*1.8).toFixed(2));
      v.style.animationDelay=(i*.32)+'s';
      steam.appendChild(v);
    });
  }
  vents();
  function cl(x){return x<0?0:x>1?1:x}
  function eio(p){return (1-Math.cos(Math.PI*p))/2}
  function eo(p){return 1-Math.pow(1-p,3)}
  function puff(x,y,big){
    var d=document.createElement('i');d.className='ttpop-puff';
    var a=Math.random()-.5;
    d.style.left=x+'px';d.style.top=y+'px';
    d.style.setProperty('--dx',(a*(big?180:70))+'px');
    d.style.setProperty('--dy',(big?8:24+Math.random()*36)+'px');
    d.style.setProperty('--s',((big?3.4:2)+Math.random()).toFixed(2));
    sm.appendChild(d);setTimeout(function(){d.remove()},1900);
  }
  function putBack(){
    r.classList.remove('ttpop-fly','lit');
    r.style.cssText='';
    fl.classList.remove('on');fl.style.height='';
    wrap.classList.remove('ttpop-go');
    if(r.parentNode!==home)home.appendChild(r);
  }
