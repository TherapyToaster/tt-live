<!-- TT arcade chat bottom v1
     Paste into the /arcade page: Pages → Toasty's ARTcade → gear → Advanced → Page Header Code Injection.
     Append after any existing page-header code; do not replace the sitewide Header Code Injection.
     On viewports max-width 799px, moves the rendered Toaster Chat panel (aside.ta-chat) to just after
     #tt-tsa (Tesla Arcade), so it sits at the bottom of the ARTcade content, below games, Live Chess,
     and Tesla Arcade. Desktop is unchanged. Does not move or rewrite the Chatango embed script. -->
<style>
/* TT arcade chat bottom v1 */
@media (max-width: 799px) {
  .ta-chat.tt-chat-bottom {
    box-sizing: border-box;
    width: 100%;
    max-width: 1200px;
    margin-top: 28px;
    margin-right: auto;
    margin-bottom: 40px;
    margin-left: auto;
    padding: 12px 8px;
    border: 2px solid #FFD400;
    border-radius: 14px;
    background: #111;
    box-shadow: 4px 4px 0 #ff2b4a, -4px -4px 0 rgba(0, 229, 255, 0.55);
    color: #dee3de;
    font-family: inherit;
    text-align: center;
  }
  .ta-chat.tt-chat-bottom h3 {
    margin: 0 0 10px;
    color: #FFD400;
    text-align: center;
  }
  .ta-chat.tt-chat-bottom .ta-cbox {
    position: relative;
    width: 100%;
    height: 440px;
    overflow: hidden;
    border-radius: 8px;
  }
  .ta-chat.tt-chat-bottom .ta-cbox iframe {
    display: block;
    width: 100% !important;
    height: 100% !important;
    max-width: 100%;
    border-width: 0;
    border-style: none;
  }
}
@media (min-width: 641px) and (max-width: 799px) {
  .ta-chat.tt-chat-bottom {
    padding: 14px;
  }
  .ta-chat.tt-chat-bottom .ta-cbox {
    height: 520px;
  }
}
/* /TT arcade chat bottom v1 */
</style>
<script>
(function () {
  if (window.__ttArcadeChatBottom) return;
  window.__ttArcadeChatBottom = 1;
  try { if (window.self !== window.top) return; } catch (e) { return; }
  if (!/^\/arcade\/?$/.test(location.pathname) && location.protocol !== 'file:' && location.hostname !== '127.0.0.1' && location.hostname !== 'localhost') return;

  var MQ = '(max-width: 799px)';
  var home = null;
  var next = null;

  function nodes() {
    return {
      chat: document.querySelector('aside.ta-chat'),
      tsa: document.getElementById('tt-tsa'),
      side: document.querySelector('#tt-arc .ttch-side')
    };
  }

  function remember(chat) {
    if (home || !chat || !chat.parentNode) return;
    if (chat.classList.contains('tt-chat-bottom')) return;
    home = chat.parentNode;
    next = chat.nextElementSibling;
  }

  function toBottom() {
    var n = nodes();
    if (!n.chat || !n.tsa || !n.tsa.parentNode) return;
    remember(n.chat);
    if (n.chat.previousElementSibling !== n.tsa) {
      n.tsa.parentNode.insertBefore(n.chat, n.tsa.nextSibling);
    }
    n.chat.classList.add('tt-chat-bottom');
  }

  function toHome() {
    var n = nodes();
    if (!n.chat) return;
    n.chat.classList.remove('tt-chat-bottom');
    var dest = home || n.side;
    if (!dest) return;
    if (n.chat.parentNode === dest && (!next || n.chat.nextElementSibling === next)) return;
    if (next && next.parentNode === dest) dest.insertBefore(n.chat, next);
    else if (n.chat.parentNode !== dest) dest.appendChild(n.chat);
  }

  function apply() {
    if (document.body && document.body.classList.contains('sqs-edit-mode-active')) return;
    var n = nodes();
    if (window.matchMedia(MQ).matches) toBottom();
    else if (home || (n.chat && n.chat.classList.contains('tt-chat-bottom'))) toHome();
  }

  function start() {
    apply();
    var mql = window.matchMedia(MQ);
    if (mql.addEventListener) mql.addEventListener('change', apply);
    else if (mql.addListener) mql.addListener(apply);
  }

  function whenReady() {
    if (nodes().chat && nodes().tsa) { start(); return true; }
    return false;
  }

  if (!whenReady()) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () { whenReady(); });
    }
    var mo = new MutationObserver(function () {
      if (whenReady()) mo.disconnect();
    });
    mo.observe(document.documentElement, { childList: true, subtree: true });
    setTimeout(function () { mo.disconnect(); }, 8000);
  }
})();
</script>
