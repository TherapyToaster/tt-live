<!-- TherapyToaster Food Reviews intro v2: neon Mr. Toasty / Therapy Toaster sign, only intro -->
<style>
#ttfoodintro-ov{position:fixed;inset:0;z-index:2147483647;background:#000;color:#FFD400;overflow:hidden;opacity:1;transition:opacity .28s ease;font-family:monospace}
#ttfoodintro-ov.ttfoodintro-out{opacity:0;pointer-events:none}
#ttfoodintro-ov video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#ttfoodintro-ov .ttfoodintro-controls{position:absolute;z-index:2;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:14px;padding:0 12px}
#ttfoodintro-ov button{appearance:none;border:1px solid #FFD400;background:rgba(0,0,0,.82);color:#FFD400;font:700 12px/1.2 monospace;letter-spacing:.05em;text-transform:uppercase;padding:12px 15px;min-height:44px;cursor:pointer;box-shadow:3px 3px 0 rgba(255,212,0,.2)}
#ttfoodintro-ov button:hover,#ttfoodintro-ov button:focus-visible{background:#FFD400;color:#000;outline:2px solid #FFD400;outline-offset:3px}
@media(prefers-reduced-motion:reduce){#ttfoodintro-ov{display:none}}
</style>
<script>
(function(){
  'use strict';
  if(location.pathname.replace(/\/+$/,'')!=='/food-reviews')return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var K='ttfoodintro-v2-seen';
  try{if(sessionStorage.getItem(K))return;sessionStorage.setItem(K,'1')}catch(e){}
  if(document.getElementById('ttfoodintro-ov'))return;
  var CDN='https://cdn.jsdelivr.net/gh/TherapyToaster/tt-live@main/site-intro/';
  var PAGES='https://therapytoaster.github.io/tt-live/site-intro/';
  var ov=document.createElement('div');ov.id='ttfoodintro-ov';
  ov.setAttribute('role','dialog');ov.setAttribute('aria-modal','true');ov.setAttribute('aria-label','Fat Coty\'s Food Reviews intro');
  ov.innerHTML='<video muted autoplay playsinline webkit-playsinline preload="auto" poster="'+CDN+'food-reviews-intro-v2-poster.jpg" aria-label="Mr. Toasty Therapy Toaster neon sign"><source src="'+CDN+'food-reviews-intro-v2.mp4" type="video/mp4"><source src="'+PAGES+'food-reviews-intro-v2.mp4" type="video/mp4"></video>'+
    '<div class="ttfoodintro-controls"><button type="button" class="ttfoodintro-sound" aria-pressed="false">Tap for sound</button><button type="button" class="ttfoodintro-skip">Skip</button></div>';
  var v=ov.querySelector('video'),sound=ov.querySelector('.ttfoodintro-sound'),skip=ov.querySelector('.ttfoodintro-skip');
  var done=false,started=false,tFlash,tBlocked,tHard,tHold,prevFocus,oldOverflow;
  v.muted=true;v.defaultMuted=true;v.playsInline=true;v.loop=false;
  function finish(){
    if(done)return;done=true;
    clearTimeout(tFlash);clearTimeout(tBlocked);clearTimeout(tHard);clearTimeout(tHold);
    try{v.pause()}catch(e){}v.muted=true;
    ov.classList.add('ttfoodintro-out');document.removeEventListener('keydown',keys,true);
    if(document.body)document.body.style.overflow=oldOverflow;
    setTimeout(function(){ov.remove();if(prevFocus&&prevFocus.isConnected&&prevFocus.focus)prevFocus.focus({preventScroll:true})},300);
  }
  function end(){finish()}
  function keys(e){
    if(e.key==='Escape'){e.preventDefault();end()}
    if(e.key==='Tab'){e.preventDefault();(document.activeElement===sound?skip:sound).focus({preventScroll:true})}
  }
  v.addEventListener('playing',function(){if(done)return;started=true;clearTimeout(tBlocked)});
  v.addEventListener('ended',function(){
    if(done)return;
    clearTimeout(tHard);
    tHold=setTimeout(end,1100);
  });
  v.addEventListener('error',function(){if(!v.currentSrc||v.networkState===HTMLMediaElement.NETWORK_NO_SOURCE)finish()});
  skip.addEventListener('click',function(e){e.stopPropagation();end()});
  ov.addEventListener('click',function(e){if(!e.target.closest('button'))end()});
  sound.addEventListener('click',function(){
    if(done)return;v.muted=!v.muted;sound.textContent=v.muted?'Tap for sound':'Mute';sound.setAttribute('aria-pressed',String(!v.muted));
    var p=v.play();if(p&&p.catch)p.catch(function(){});
  });
  function mount(){
    if(done)return;prevFocus=document.activeElement;oldOverflow=document.body.style.overflow;
    document.body.appendChild(ov);document.body.style.overflow='hidden';skip.focus({preventScroll:true});
    document.addEventListener('keydown',keys,true);
    tHard=setTimeout(function(){if(!started){end();return}tHold=setTimeout(end,1100)},7000);
    tFlash=setTimeout(function(){
      if(done)return;
      tBlocked=setTimeout(function(){if(!started)finish()},1200);
      var p;try{p=v.play()}catch(e){setTimeout(finish,900);return}
      if(p&&p.catch)p.catch(function(){setTimeout(function(){if(!started)finish()},900)});
    },80);
  }
  if(document.body)mount();else document.addEventListener('DOMContentLoaded',mount,{once:true});
})();
</script>
