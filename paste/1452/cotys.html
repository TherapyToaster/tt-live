#cotys-space .gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
#cotys-space .gal a{display:block;min-width:0}
#cotys-space .gal img{display:block;width:100%;height:auto;aspect-ratio:92/70}
/* Comments table: keep table but fixed, fluid layout; scroll as fallback */

#cotys-space .cw{width:96px;font-size:14px;padding:6px 4px}
#cotys-space .cw img,#cotys-space .cw .ph{width:100%;max-width:80px;height:auto;aspect-ratio:1/1;margin-left:auto;margin-right:auto}

#cotys-space .com td.cb{font-size:14px;line-height:1.45}
#cotys-space .sample{font-size:14px}
#cotys-space .foot{font-size:14px;padding:15px 10px;line-height:1.6}
/* Chatango boxes */
#cotys-space .chatbox{height:420px;width:100%}
#cotys-space .chatbox iframe{width:100%!important}
}
@media (max-width:560px){
#cotys-space .top8 tbody{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:340px){
#cotys-space .top8 tbody{grid-template-columns:repeat(2,minmax(0,1fr))}
#cotys-space .gal{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media (max-width:768px){
#cotys-space,section.page-section:has(#cotys-space) .section-background,section.page-section:has(#cotys-space) .section-background:before,section.page-section:has(#cotys-space) .section-background:after{background-attachment:scroll}

#cotys-space .foot{width:auto;margin:0 0 10px}
