<style>.fe-block:has(#toaster-tanks){grid-column:2/-2 !important}</style><style>
#toaster-tanks{background:#05070d;color:#dee3de;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px;border:1px solid #2a2a1a;border-radius:10px;box-sizing:border-box;width:100%;max-width:100%;overflow:hidden;outline:none}
#toaster-tanks *{box-sizing:border-box}
#toaster-tanks .tt-title{margin:0 0 8px;text-align:center;color:#c5a834;font-size:28px;letter-spacing:4px;font-weight:800}
#toaster-tanks .tt-hud{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
#toaster-tanks .tt-pl{flex:1 1 0;min-width:0}
#toaster-tanks .tt-p2{text-align:right}
#toaster-tanks .tt-name{width:100%;max-width:150px;background:transparent;border:1px solid #333;border-radius:4px;color:#dee3de;font:inherit;font-weight:700;padding:2px 4px}
#toaster-tanks .tt-p1 .tt-name{color:#c5a834}
#toaster-tanks .tt-p2 .tt-name{color:#ff5a5a;text-align:right}
#toaster-tanks .tt-bar{height:8px;background:#222;border-radius:4px;margin:4px 0;overflow:hidden}
#toaster-tanks .tt-bar i{display:block;height:100%;width:100%;background:#c5a834}
#toaster-tanks .tt-p2 .tt-bar i{background:#b00000;margin-left:auto}
#toaster-tanks .tt-sc{font-size:12px}
#toaster-tanks .tt-mid{text-align:center;font-size:13px;flex:0 0 auto}
#toaster-tanks .tt-wind{color:#c5a834;font-weight:700}
#toaster-tanks .tt-stage{width:100%;aspect-ratio:16/9;background:#05070d;border:1px solid #333;border-radius:6px;overflow:hidden}
#toaster-tanks canvas{display:block;width:100%;height:100%;touch-action:none}
#toaster-tanks .tt-status{text-align:center;margin:6px 0;min-height:20px;font-weight:600}
#toaster-tanks .tt-row{display:flex;align-items:center;gap:8px;margin:4px 0}
#toaster-tanks .tt-row label{flex:0 0 92px;font-size:14px}
#toaster-tanks .tt-row input{flex:1 1 auto;min-width:0;accent-color:#c5a834;height:28px}
#toaster-tanks .tt-weps,#toaster-tanks .tt-btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}
#toaster-tanks button{background:#141824;color:#dee3de;border:1px solid #c5a834;border-radius:6px;padding:8px 10px;font:inherit;font-size:14px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#toaster-tanks button.on{background:#c5a834;color:#05070d;font-weight:700}
#toaster-tanks button:disabled{opacity:.4;cursor:default}
#toaster-tanks .tt-fire{background:#c5a834;color:#05070d;font-weight:800;padding:8px 18px}
#toaster-tanks .tt-fuel{font-size:13px;min-width:64px;text-align:center}
#toaster-tanks .tt-help{font-size:12px;opacity:.7;margin:6px 0}
#toaster-tanks .tt-credit{text-align:center;font-size:13px;margin:8px 0 0}
#toaster-tanks .tt-credit a{color:#c5a834}
</style>

var cv=$('.tt-canvas'),ctx=cv.getContext('2d');
var W=960,H=540,G=0.15,FUEL=60,ROUNDS=10;
var WEAP=[{n:'Toast',r:28,d:35},{n:'Burnt Toast',r:55,d:50},{n:'Crumbs',r:20,d:20,spread:1},{n:'Butter Roller',r:34,d:38,roll:1},{n:'Jam Bomb',r:26,d:22,jam:1},{n:'Dirt Loaf',r:48,d:0,dirt:1}];
var hgt=new Float32Array(W),S,names=['Toasty','Crusty'],moving=0,scale=1;
var wb=$('.tt-weps');
WEAP.forEach(function(w,i){var b=document.createElement('button');b.type='button';b.textContent=(i+1)+' '+w.n;b.onclick=function(){setW(i);};wb.appendChild(b);});
function genTerrain(){var a=[],i;for(i=0;i<4;i++)a.push({amp:(Math.random()*40+10)/(i+1),f:(Math.random()*2+1)*(i+1)*Math.PI*2/W,p:Math.random()*7});
for(var x=0;x<W;x++){var y=H*0.68;for(i=0;i<4;i++)y+=a[i].amp*Math.sin(x*a[i].f+a[i].p);hgt[x]=Math.max(H*0.35,Math.min(H*0.9,y));}}
function mkTank(i){var x=Math.round(W*(i?0.8+Math.random()*0.1:0.1+Math.random()*0.1));return{x:x,y:hgt[x],vy:0,fy:null,hp:100,score:0,ang:i?135:45,pow:60,w:0,fuel:FUEL,col:i?'#b00000':'#c5a834'};}
function newGame(){genTerrain();S={p:[mkTank(0),mkTank(1)],turn:0,shots:0,wind:0,proj:[],ex:[],trail:[],old:[[],[]],mode:'aim',msg:''};startTurn();}
function cur(){return S.p[S.turn];}
function startTurn(){S.wind=Math.round((Math.random()*2-1)*10);cur().fuel=FUEL;S.mode='aim';S.msg=names[S.turn]+'\u2019s turn';sync();}
function setW(i){if(S.mode!=='aim')return;cur().w=i;sync();}
function fire(){if(S.mode!=='aim')return;var t=cur(),wp=WEAP[t.w],angs=wp.spread?[t.ang-6,t.ang,t.ang+6]:[t.ang];
angs.forEach(function(a){var r=a*Math.PI/180,v=t.pow*0.14;S.proj.push({x:t.x+Math.cos(r)*14,y:t.y-10-Math.sin(r)*14,vx:Math.cos(r)*v,vy:-Math.sin(r)*v,wp:wp,own:S.turn,alive:1});});
S.trail=[];S.mode='fly';S.msg=names[S.turn]+' fires '+wp.n+'!';sync();}
function move(d){if(!S||S.mode!=='aim')return;var t=cur();if(t.fuel<=0)return;var nx=t.x+d*2;if(nx<10||nx>W-10)return;var ny=hgt[nx|0];if(ny<t.y-8)return;t.x=nx;if(ny<t.y)t.y=ny;t.fuel-=2;sync();}
function explode(x,y,r,d,dirt,own){x=Math.round(x);
for(var i=Math.max(0,x-r);i<=Math.min(W-1,x+r);i++){var dy=Math.sqrt(Math.max(0,r*r-(i-x)*(i-x))),top=y-dy,bot=y+dy,h=hgt[i];
if(dirt){if(top<h)hgt[i]=Math.max(10,top);}else if(bot>h){var rem=Math.min(bot,H)-Math.max(top,h);if(rem>0)hgt[i]=Math.min(H,h+rem);}}
S.ex.push({x:x,y:y,r:r,t:0,c:dirt?'#8a5a2b':(d<15?'#c0263a':'#ff9a2a')});
if(d){S.p.forEach(function(t,k){var dist=Math.hypot(t.x-x,t.y-6-y);if(dist<r+10){var dm=Math.round(d*(1-dist/(r+10)));if(dm>0){t.hp=Math.max(0,t.hp-dm);if(k!==own)S.p[own].score+=dm;S.msg=names[k]+' takes '+dm+' damage!';}}});}
sync();}
function hitTank(x,y){for(var k=0;k<2;k++){var t=S.p[k];if(Math.hypot(t.x-x,t.y-6-y)<11)return 1;}return 0;}
function stepProj(p){var w=p.wp;
if(p.rolling){for(var s=0;s<2&&p.alive;s++){var nx=p.x+p.dir;if(nx<0||nx>=W){p.alive=0;return;}var ny=hgt[nx];
if(ny<p.y-4||p.dist>220||hitTank(nx,ny-4)){p.alive=0;explode(p.x,p.y,w.r,w.d,0,p.own);return;}p.x=nx;p.y=ny;p.dist++;if(p.dist%3===0)S.trail.push([p.x,p.y-2]);}return;}
p.vx+=S.wind*0.002;p.vy+=G;p.x+=p.vx;p.y+=p.vy;S.trail.push([p.x,p.y]);if(S.trail.length>1500)S.trail.shift();
if(p.x<0||p.x>=W||p.y>=H){p.alive=0;if(p.y<H)S.msg='Out of bounds!';return;}
var hit=hitTank(p.x,p.y);if(!hit&&p.y>=0&&p.y<hgt[p.x|0])return;
if(w.roll&&!hit){p.rolling=1;p.dir=p.vx>=0?1:-1;p.dist=0;p.x=p.x|0;p.y=hgt[p.x];return;}
p.alive=0;
if(w.jam){for(var j=0;j<6;j++)S.proj.push({x:p.x,y:Math.min(p.y,hgt[p.x|0])-3,vx:(Math.random()-0.5)*4,vy:-1-Math.random()*2.5,wp:{r:16,d:9},own:p.own,alive:1});}
explode(p.x,p.y,w.r,w.d,w.dirt,p.own);}
function settle(){var busy=0;S.p.forEach(function(t){var g=hgt[Math.max(0,Math.min(W-1,t.x|0))];
if(t.y<g-0.5){if(t.fy===null)t.fy=t.y;t.vy+=0.3;t.y=Math.min(g,t.y+t.vy);busy=1;}
else{t.y=g;if(t.fy!==null){var drop=t.y-t.fy;if(drop>30){var dm=Math.floor((drop-30)/6);t.hp=Math.max(0,t.hp-dm);if(dm)S.msg='Fall damage: '+dm;}t.fy=null;t.vy=0;sync();}}});return busy;}
function endTurn(){S.shots++;S.old[S.turn]=S.trail;var a=S.p[0],b=S.p[1];
if(a.hp<=0||b.hp<=0||S.shots>=ROUNDS*2){S.mode='over';var win=a.hp<=0&&b.hp<=0?-1:a.hp<=0?1:b.hp<=0?0:(a.score===b.score?(a.hp===b.hp?-1:(a.hp>b.hp?0:1)):(a.score>b.score?0:1));
S.msg=(win<0?'Draw!':names[win]+' wins!')+' Press New Game to play again.';sync();return;}
S.turn^=1;startTurn();}
function tick(){if(S){if(moving)move(moving);
if(S.mode==='fly'){for(var i=0;i<S.proj.length;i++)if(S.proj[i].alive)stepProj(S.proj[i]);S.proj=S.proj.filter(function(p){return p.alive;});}
var busy=settle();S.ex.forEach(function(e){e.t++;});S.ex=S.ex.filter(function(e){return e.t<24;});
if(S.mode==='fly'&&!S.proj.length&&!S.ex.length&&!busy)endTurn();draw();}
requestAnimationFrame(tick);}
function draw(){var r=cv.getBoundingClientRect(),dpr=window.devicePixelRatio||1,bw=Math.max(1,Math.round(r.width*dpr)),bh=Math.max(1,Math.round(r.height*dpr));
if(cv.width!==bw||cv.height!==bh){cv.width=bw;cv.height=bh;}scale=bw/W;ctx.setTransform(scale,0,0,bh/H,0,0);
var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#05070d');g.addColorStop(1,'#141a30');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.beginPath();ctx.moveTo(0,H);for(var x=0;x<W;x++)ctx.lineTo(x,hgt[x]);ctx.lineTo(W,H);ctx.closePath();
g=ctx.createLinearGradient(0,H*0.35,0,H);g.addColorStop(0,'#8b5e2e');g.addColorStop(1,'#2e1d0c');ctx.fillStyle=g;ctx.fill();
ctx.beginPath();for(x=0;x<W;x++)ctx.lineTo(x,hgt[x]);ctx.strokeStyle='#c5a834';ctx.lineWidth=2;ctx.stroke();
function dots(tr,c){ctx.fillStyle=c;for(var i=0;i<tr.length;i+=2)ctx.fillRect(tr[i][0]-1,tr[i][1]-1,2,2);}
dots(S.old[0],'rgba(197,168,52,.25)');dots(S.old[1],'rgba(176,0,0,.35)');dots(S.trail,S.turn?'#ff6a6a':'#f0d870');
S.p.forEach(function(t,k){ctx.fillStyle=t.col;ctx.strokeStyle=t.col;ctx.lineWidth=3;var a=t.ang*Math.PI/180;
ctx.beginPath();ctx.moveTo(t.x,t.y-10);ctx.lineTo(t.x+Math.cos(a)*14,t.y-10-Math.sin(a)*14);ctx.stroke();
ctx.beginPath();ctx.arc(t.x,t.y-8,6,Math.PI,0);ctx.fill();ctx.fillRect(t.x-12,t.y-8,24,7);ctx.fillStyle='#222';ctx.fillRect(t.x-11,t.y-2,22,3);
ctx.fillStyle='#333';ctx.fillRect(t.x-15,t.y-30,30,4);ctx.fillStyle=t.hp>50?'#5c5':t.hp>25?'#dc3':'#e33';ctx.fillRect(t.x-15,t.y-30,30*t.hp/100,4);
if(k===S.turn&&S.mode==='aim'){ctx.fillStyle='#dee3de';ctx.beginPath();ctx.moveTo(t.x-5,t.y-42);ctx.lineTo(t.x+5,t.y-42);ctx.lineTo(t.x,t.y-35);ctx.fill();}});
S.proj.forEach(function(p){ctx.fillStyle=p.wp.jam||p.wp.d===9?'#e0304a':p.wp.dirt?'#a0703a':'#fff3c0';ctx.beginPath();ctx.arc(p.x,p.y,3.5,0,7);ctx.fill();});
S.ex.forEach(function(e){ctx.globalAlpha=1-e.t/24;ctx.fillStyle=e.c;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(0.4+e.t/40),0,7);ctx.fill();ctx.globalAlpha=1;});
var wx=W/2,wl=S.wind*6;ctx.strokeStyle='#c5a834';ctx.fillStyle='#c5a834';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(wx-wl,24);ctx.lineTo(wx+wl,24);ctx.stroke();
if(S.wind){var s=S.wind>0?1:-1;ctx.beginPath();ctx.moveTo(wx+wl+s*8,24);ctx.lineTo(wx+wl,17);ctx.lineTo(wx+wl,31);ctx.fill();}
ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('WIND '+Math.abs(S.wind),wx,48);
if(S.mode==='over'){ctx.fillStyle='rgba(5,7,13,.7)';ctx.fillRect(0,H/2-50,W,100);ctx.fillStyle='#c5a834';ctx.font='bold 40px sans-serif';ctx.fillText('GAME OVER',W/2,H/2);ctx.font='20px sans-serif';ctx.fillStyle='#dee3de';ctx.fillText(S.msg.split('!')[0]+'!',W/2,H/2+32);}}
function sync(){var t=cur(),i;for(i=0;i<2;i++){var p=root.querySelector('.tt-p'+(i+1));p.querySelector('.tt-bar i').style.width=S.p[i].hp+'%';p.querySelector('.tt-sc').textContent='HP '+S.p[i].hp+' \u00b7 Score '+S.p[i].score;}
$('.tt-round').textContent='Round '+Math.min(ROUNDS,Math.floor(S.shots/2)+1)+'/'+ROUNDS;
$('.tt-wind').textContent='Wind '+(S.wind<0?'\u2190 ':S.wind>0?'\u2192 ':'')+Math.abs(S.wind);
$('.tt-ang').value=t.ang;$('.tt-pow').value=t.pow;$('.tt-av').textContent=t.ang+'\u00b0';$('.tt-pv').textContent=t.pow;$('.tt-fuel').textContent='Fuel '+Math.max(0,t.fuel);
var bs=wb.children;for(i=0;i<bs.length;i++){bs[i].className=i===t.w?'on':'';bs[i].disabled=S.mode!=='aim';}
$('.tt-fire').disabled=$('.tt-ml').disabled=$('.tt-mr').disabled=S.mode!=='aim';$('.tt-status').textContent=S.msg;
var sum=0;for(i=0;i<W;i++)sum+=hgt[i];var ds=root.dataset;ds.terrain=sum.toFixed(1);ds.hp1=S.p[0].hp;ds.hp2=S.p[1].hp;ds.mode=S.mode;ds.turn=S.turn;ds.wind=S.wind;ds.shots=S.shots;
ds.t1=S.p[0].x+','+S.p[0].y;ds.t2=S.p[1].x+','+S.p[1].y;}
$('.tt-ang').addEventListener('input',function(){if(S.mode==='aim'){cur().ang=+this.value;sync();}});
$('.tt-pow').addEventListener('input',function(){if(S.mode==='aim'){cur().pow=+this.value;sync();}});
$('.tt-fire').onclick=fire;$('.tt-new').onclick=function(){newGame();root.focus();};
[['.tt-ml',-1],['.tt-mr',1]].forEach(function(m){var b=$(m[0]);b.addEventListener('pointerdown',function(e){e.preventDefault();moving=m[1];});
['pointerup','pointerleave','pointercancel'].forEach(function(ev){b.addEventListener(ev,function(){moving=0;});});});
root.querySelectorAll('.tt-name').forEach(function(inp){inp.addEventListener('input',function(){names[+inp.getAttribute('data-i')]=inp.value||('Player '+(+inp.getAttribute('data-i')+1));});});
cv.addEventListener('pointerdown',function(){root.focus();});
root.addEventListener('keydown',function(e){if(e.target.classList&&e.target.classList.contains('tt-name'))return;if(!S||S.mode!=='aim')return;var t=cur(),k=e.key,h=1;
if(k==='ArrowLeft')t.ang=Math.min(180,t.ang+1);else if(k==='ArrowRight')t.ang=Math.max(0,t.ang-1);else if(k==='ArrowUp')t.pow=Math.min(100,t.pow+1);else if(k==='ArrowDown')t.pow=Math.max(5,t.pow-1);
else if(k==='a'||k==='A')move(-1);else if(k==='d'||k==='D')move(1);else if(k===' '||k==='Spacebar')fire();else if(k>='1'&&k<='6')t.w=+k-1;else h=0;
if(h){e.preventDefault();sync();}});
newGame();requestAnimationFrame(tick);
})();
</script>
<style id="tt-h1-tanks">#toaster-tanks h1.tt-title{font-family:Anton;line-height:1.1136em;text-transform:uppercase}</style>
