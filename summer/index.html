<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Toaster Summer</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;padding:0;background:#050506;overflow:hidden;height:100%;width:100%;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
#wrap{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#050506;
  touch-action:none;-webkit-touch-callout:none;overscroll-behavior:none;}
#c,#hud{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none;}
#c{z-index:0;background:#140818;}
#hud{z-index:1;pointer-events:auto;}
#credit{position:absolute;right:12px;bottom:10px;z-index:2;pointer-events:none;
  color:rgba(244,240,228,0.72);font:11px/1.3 system-ui,sans-serif;
  text-shadow:0 1px 2px rgba(0,0,0,0.65);}
#loader{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#1a2430 0%,#0b1016 70%,#07090c 100%);color:#f4f0e4;
  font:16px/1.4 system-ui,sans-serif;letter-spacing:0.02em;}
#loader h1{font:600 28px/1.2 system-ui,sans-serif;margin:0 0 8px;color:#f7f3e8;}
#loader .sub{opacity:0.7;margin-bottom:28px;font-size:13px;}
#loader-track{width:min(420px,70vw);height:8px;border-radius:99px;background:rgba(255,255,255,0.12);overflow:hidden;}
#loader-bar{height:100%;width:0%;border-radius:99px;background:#7ec8c0;transition:width 0.15s ease-out;}
#loader-msg{margin-top:12px;font-size:12px;opacity:0.75;}
#loader.hide{opacity:0;pointer-events:none;transition:opacity 0.35s ease;}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" aria-label="Toaster Summer"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<div id="credit">© OpenStreetMap contributors</div>
<div id="loader">
  <h1>Toaster Summer</h1>
  <div class="sub">Surf City, NC</div>
  <div id="loader-track"><div id="loader-bar"></div></div>
  <div id="loader-msg">Loading assets…</div>
</div>
</div>
<script src="js/game.js"></script>
</body>
</html>
